<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أداة نقل البيانات</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: Tahoma, sans-serif; background: #f4efe4; padding: 15px; }
  .card { background: #fff; padding: 20px; border-radius: 12px; max-width: 500px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  input, button { width: 100%; padding: 12px; margin: 8px 0; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
  button { background: #1f4d2e; color: white; border: none; font-weight: bold; margin-top: 15px;}
  .log { height: 150px; overflow: auto; background: #222; color: #0f0; padding: 10px; font-family: monospace; font-size: 12px; text-align: left; direction: ltr; border-radius: 8px; margin-top: 10px;}
  .hidden { display: none; }
  .title { text-align: center; color: #1f4d2e; font-weight: bold; margin-bottom: 15px;}
</style>
</head>
<body>

<div class="card" id="setup">
  <div class="title">إعداد الاتصال بـ Supabase (جاهز ✅)</div>
  <p style="font-size:14px; color:gray; text-align:center;">الرابط والمفتاح متسجلين تلقائياً.</p>
  <input type="email" id="sb-email" placeholder="الإيميل">
  <input type="password" id="sb-pass" placeholder="الباسورد">
  <button onclick="doLogin()">تسجيل الدخول</button>
</div>

<div class="card hidden" id="upload">
  <div class="title">اختر ملف النسخة الاحتياطية</div>
  <input type="file" id="json-file" accept=".json" onchange="startImport(this.files[0])">
  <div id="log" class="log">بانتظار الملف...</div>
</div>

<div class="card hidden" id="result">
  <div class="title" style="color:green;">✅ تقرير المطابقة</div>
  <div id="report" style="font-size:16px; line-height:2;"></div>
</div>

<script>
  const SB_URL = "https://hioringmhouagmmtvdcp.supabase.co";
  const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhpb3JpbmdtaG91YWdtbXR2ZGNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5ODM3MjQsImV4cCI6MjEwOTU1OTcyNH0.Zv9sSxuVSgvjnjP7DtPplfAvMeg3W9IiBY_WnDSsunQ";
  
  let sb;
  function log(msg) { document.getElementById('log').innerHTML += msg + '<br>'; }

  async function doLogin() {
    try {
      const email = document.getElementById('sb-email').value.trim();
      const pass = document.getElementById('sb-pass').value;
      if(!email || !pass) return alert('اكتب الإيميل والباسورد');

      // هنا الغلطة اتصلحت (supabase بدل supabasejs)
      sb = supabase.createClient(SB_URL, SB_KEY);
      const { error } = await sb.auth.signInWithPassword({ email, password: pass });
      
      if (error) throw new Error(error.message);

      document.getElementById('setup').classList.add('hidden');
      document.getElementById('upload').classList.remove('hidden');
    } catch (err) {
      alert('خطأ في الدخول: ' + (err.message || 'تأكد من البيانات'));
    }
  }

  async function startImport(file) {
    if(!file) return;
    log('جاري قراءة الملف...');
    const text = await file.text();
    let S;
    try { S = JSON.parse(text); } catch (e) { return log('<span style="color:red">الملف غير صالح</span>'); }

    log(`العملاء: ${S.customers?.length || 0} | المنتجات: ${S.products?.length || 0}`);
    
    try {
      log('جاري رفع العملاء...');
      const cMap = {};
      if (S.customers && S.customers.length) {
        const rows = S.customers.map(c => ({
          legacy_id: String(c.id), name: c.name || 'بدون اسم', phone: c.phone || '', shop: c.shop || '', mz: c.mz || '', village: c.village || '', crop: c.crop || '', disc: Number(c.disc) || 0, note: c.note || '', lat: c.lat != null ? Number(c.lat) : null, lng: c.lng != null ? Number(c.lng) : null, approx: !!c.approx, lim: Number(c.lim) || 0
        }));
        for (let i = 0; i < rows.length; i += 100) {
          const chunk = rows.slice(i, i + 100);
          const { data, error } = await sb.from('customers').insert(chunk).select('id, legacy_id');
          if (error) throw new Error('عملاء: ' + error.message);
          data.forEach(d => { cMap[d.legacy_id] = d.id; });
        }
      }

      log('جاري رفع المنتجات...');
      const pMap = {};
      if (S.products && S.products.length) {
        const rows = S.products.map(p => ({
          legacy_id: String(p.id), name: p.name || 'بدون اسم', cat: p.cat || 'أسمدة', unit: p.unit || 'عبوة', price: Number(p.price) || 0, cost: Number(p.cost) || 0, stock: Number(p.stock) || 0, min: Number(p.min) || 0, ai: p.ai || '', sz: p.sz || '', barcode: p.barcode || ''
        }));
        for (let i = 0; i < rows.length; i += 100) {
          const chunk = rows.slice(i, i + 100);
          const { data, error } = await sb.from('products').insert(chunk).select('id, legacy_id');
          if (error) throw new Error('منتجات: ' + error.message);
          data.forEach(d => { pMap[d.legacy_id] = d.id; });
        }
      }

      log('جاري رفع الطلبات...');
      const oMap = {};
      if (S.orders && S.orders.length) {
        for (const o of S.orders) {
          const newCid = cMap[String(o.cid)];
          if (!newCid) continue;
          const { data: od, error: oe } = await sb.from('orders').insert({
            legacy_id: String(o.id), cid: newCid, t: new Date(o.t).toISOString(), total: Number(o.total) || 0, paid: Number(o.paid) || 0, disc: Number(o.disc) || 0, cx: !!o.cx
          }).select('id').single();
          if (oe) continue;
          oMap[String(o.id)] = od.id;
          if (o.items && o.items.length) {
            const items = o.items.map(i => ({ order_id: od.id, pid: pMap[String(i.pid)], name: i.name || 'منتج', qty: Number(i.qty) || 1, price: Number(i.price) || 0 })).filter(i=>i.pid);
            if (items.length) await sb.from('order_items').insert(items);
          }
        }
      }

      log('جاري رفع الحسابات...');
      if (S.ledger && S.ledger.length) {
        const rows = S.ledger.map(l => ({ legacy_id: String(l.id), cid: cMap[String(l.cid)], type: l.type, amt: Number(l.amt) || 0, t: new Date(l.t).toISOString(), oid: l.oid ? oMap[String(l.oid)] : null, note: l.note || '', entry_type: l.oid ? 'order' : 'collection' })).filter(r=>r.cid);
        for (let i = 0; i < rows.length; i += 100) await sb.from('ledger').insert(rows.slice(i, i + 100));
      }

      log('جاري رفع الزيارات...');
      if (S.visits && S.visits.length) {
        const rows = S.visits.map(v => ({ legacy_id: String(v.id), cid: cMap[String(v.cid)], t: new Date(v.t).toISOString(), auto: v.auto || 0, res: v.res || '', note: v.note || '' })).filter(r=>r.cid);
        for (let i = 0; i < rows.length; i += 100) await sb.from('visits').insert(rows.slice(i, i + 100));
      }

      // حساب المطابقة
      let origTotal = 0;
      S.ledger.forEach(l => { origTotal += (l.type === 'OWES' ? Number(l.amt) : -Number(l.amt)); });
      
      const { data: ldb } = await sb.from('ledger').select('type, amt');
      let cloudTotal = 0;
      ldb.forEach(l => { cloudTotal += (l.type === 'OWES' ? Number(l.amt) : -Number(l.amt)); });
      
      document.getElementById('upload').classList.add('hidden');
      document.getElementById('result').classList.remove('hidden');
      let html = `<p>إجمالي المديونيات في التطبيق: <b>${origTotal.toFixed(2)}</b> ج</p>
                  <p>إجمالي المديونيات في السحابة: <b>${cloudTotal.toFixed(2)}</b> ج</p>`;
      if (Math.abs(origTotal - cloudTotal) < 0.01) {
        html += `<h3 style="color:green; text-align:center;">✅ تطابق تام 100%!</h3>`;
      } else {
        html += `<h3 style="color:red; text-align:center;">⚠️ يوجد فرق، راجع البيانات.</h3>`;
      }
      document.getElementById('report').innerHTML = html;

    } catch (err) {
      log('<span style="color:red">❌ خطأ: ' + err.message + '</span>');
    }
  }
</script>
</body>
</html>
