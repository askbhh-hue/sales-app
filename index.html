<style>

:root[data-theme="dark"]{--bg:#0d1711;--surf:#13211a;--surf2:#182a20;--line:#27392d;--tx:#f0ead9;--mu:#a6b09f;--pr:#63b07a;--pr2:#7cc592;--prt:#0b1810;--prl:#193325;--acc:#e2b458;--accl:#2c2513;--ring:rgba(99,176,122,.25);--dot:rgba(99,176,122,.07);--red:#ff9184;--redl:#3a201d;--grn:#8fd6a4;--grnl:#193325;--amb:#ffc96b;--ambl:#382c15;--blu:#a2c9f0;--blul:#1a2c3c;--sh:0 1px 2px rgba(0,0,0,.35),0 10px 26px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:22px 22px;color:var(--tx);font-family:Cairo,"IBM Plex Sans Arabic",-apple-system,BlinkMacSystemFont,"SF Arabic","Geeza Pro",Tahoma,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.6;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
main{max-width:720px;margin:0 auto;padding:0 14px}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.2px;line-height:1.25}

.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}

.hs{font-size:14px;margin-top:4px}
.bigbal{font-size:34px;font-weight:700;margin-top:10px;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:0;border-radius:var(--r2);background:var(--pr);color:var(--prt);font:inherit;font-size:15px;font-weight:600;margin:0 0 10px;padding:12px 14px;cursor:pointer;text-align:center;text-decoration:none;line-height:1.3;transition:transform .08s,opacity .15s,background .15s}

.btn:disabled,.btn.off{opacity:.45;pointer-events:none}

input,select,textarea{width:100%;min-height:50px;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surf);color:var(--tx);margin:0 0 10px;outline:none;transition:border-color .15s,box-shadow .15s}

.item{display:flex;align-items:center;gap:10px;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px;box-shadow:var(--sh)}

.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nm{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb{font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fffdf8;font-weight:700;font-size:15px;letter-spacing:.3px}
.icobtn{flex:none;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surf2);color:var(--tx);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap;flex:none}
.pill.red{background:var(--redl);color:var(--red)}.pill.grn{background:var(--grnl);color:var(--grn)}.pill.amb{background:var(--ambl);color:var(--amb)}.pill.blu{background:var(--blul);color:var(--blu)}.pill.gray{background:var(--surf2);color:var(--mu)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surf);color:var(--tx);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;min-height:38px}
.chip.on{background:var(--pr);border-color:var(--pr);color:var(--prt)}
.seg{display:flex;background:var(--surf2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}

.kpi{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh);text-align:right;font:inherit;color:inherit;cursor:default;border-inline-start:3px solid var(--acc)}

.grid2,.grid3,.grid4{display:grid;gap:10px;margin-bottom:10px}

.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px 8px;min-height:92px;font:inherit;font-size:14px;font-weight:600;color:var(--tx);text-decoration:none;cursor:pointer;box-shadow:var(--sh);text-align:center;line-height:1.3}
.tile .ti{font-size:24px;line-height:1}

.tile.big{min-height:104px}
.tile.sm2{min-height:70px;font-size:13px}
.tile.sm2 .ti{font-size:21px}
.alert{border-radius:var(--r);padding:14px 16px;margin-bottom:12px;border:1px solid var(--line);background:var(--surf);box-shadow:var(--sh)}
.alert.red{background:var(--redl);border-color:transparent}.alert.amb{background:var(--ambl);border-color:transparent}.alert.blu{background:var(--blul);border-color:transparent}.alert.grn{background:var(--grnl);border-color:transparent}
.empty{text-align:center;color:var(--mu);padding:30px 16px;font-size:15px}
.empty .ico{font-size:38px;margin-bottom:8px}
.bar{flex:1;height:8px;border-radius:9px;background:var(--surf2);overflow:hidden;margin-left:10px}
.bar span{display:block;height:100%;background:var(--pr);border-radius:9px}
.acts{display:flex;align-items:center;gap:6px;flex:none}
.step{display:inline-flex;align-items:center;gap:4px;background:var(--surf2);border:1px solid var(--line);border-radius:14px;padding:4px;flex:none}
.step button{width:42px;height:42px;border:0;border-radius:11px;background:var(--surf);color:var(--tx);font-size:20px;font-weight:600;cursor:pointer;box-shadow:var(--sh)}
.step b{min-width:34px;text-align:center;font-size:17px}
.qb{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surf);color:var(--tx);font-size:20px;font-weight:600;cursor:pointer;box-shadow:var(--sh)}
.big,.stat b{font-variant-numeric:tabular-nums}
details.card>summary{cursor:pointer;list-style:none;font-weight:700;min-height:44px;display:flex;align-items:center}
details.card>summary::-webkit-details-marker{display:none}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--surf);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;box-shadow:0 -8px 24px rgba(42,34,16,.08)}
.foot .fi{flex:1;min-width:0}
.foot .fi b{font-size:18px;font-weight:700;display:block;color:var(--pr)}
.foot .btn{flex:none;width:auto;margin:0;padding:12px 18px}
.pad-foot{padding-bottom:124px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.keypad button{min-height:62px;border:1px solid var(--line);border-radius:14px;background:var(--surf2);color:var(--tx);font:inherit;font-size:24px;font-weight:600;cursor:pointer}
.keypad button.fn{font-size:18px;color:var(--mu)}
.amt{font-size:42px;font-weight:700;text-align:center;padding:8px 0;letter-spacing:-.4px;font-variant-numeric:tabular-nums;color:var(--pr)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:2px;background:var(--surf);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px rgba(42,34,16,.06)}
nav.hide{display:none}
nav button{flex:1;min-width:0;min-height:58px;border:0;background:transparent;color:var(--mu);font:inherit;font-size:12px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:14px;position:relative;transition:background .15s,color .15s}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

nav button.on::before{content:"";position:absolute;top:0;left:32%;right:32%;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}
#scrim{position:fixed;inset:0;background:rgba(20,28,22,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#scrim.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surf);border-radius:24px 24px 0 0;box-shadow:0 -12px 32px rgba(20,28,22,.25);transform:translateY(105%);transition:transform .25s ease;max-height:88vh;overflow:auto;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto}
#sheet.open{transform:translateY(0)}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:15px;display:none;z-index:70;box-shadow:0 10px 26px rgba(0,0,0,.25);max-width:90vw;text-align:center}
pre{white-space:pre-wrap;font:inherit;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{nav,.btn,#toast,.foot,#sheet,#scrim{display:none!important}body{padding:0}}
</style>
<style id="enh">

h1{font-size:26px;font-weight:800}

<body>

<script>
const K='fs_v1',CATS=['أسمدة','مبيدات'],UNITS=['شيكارة','زجاجة','لتر','كيلو','علبة','كيس','عبوة'],MZ=['بني سويف','ناصر','إهناسيا','ببا','الفشن','سمسطا','الواسطى','الفيوم'];
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(_){}
function fix(){S=S||{};['products','customers','orders','ledger','visits'].forEach(k=>S[k]=S[k]||[]);S.pin=S.pin||'';S.lb=S.lb||0;S.pv=S.pv||[];S.places=S.places||[];S.cyc=S.cyc||14;S.hide=S.hide||[];S.msgLog=S.msgLog||[];S.home=S.home||{n:'أطواب',mz:'الواسطى'};S.products.forEach(p=>{if(!CATS.includes(p.cat))p.cat='أسمدة'})}
function migrate(){if(S.mig)return;S.orders.forEach(o=>{if(o.cx||!(o.paid>0))return;const l=S.ledger.find(x=>x.oid===o.id&&x.type==='OWES');if(l){if(Math.abs(l.amt-(o.total-o.paid))<0.01)l.amt=o.total}else S.ledger.push({id:uid(),cid:o.cid,type:'OWES',amt:o.total,t:o.t,oid:o.id,note:'طلب'})});S.mig=1;save()}
fix();
let v={tab:'cov'},cart={},rp='w',unl=!S.pin,cq='';
let bootReady=!!localStorage.getItem(K)||!window.indexedDB;setTimeout(()=>{bootReady=true},5000);
var LASTJ='';let save=()=>{if(!bootReady)return;const t=Date.now();let ok=true;try{S.__ts=t;S.dv=(S.dv||0)+1;LASTJ=JSON.stringify(S);localStorage.setItem(K,LASTJ);localStorage.setItem('fs_ts',String(t))}catch(_){ok=false}if(typeof idbSched==='function')idbSched();else if(!ok)toast('تعذر الحفظ على المتصفح');if(!ok&&!save.w&&typeof idbSched==='function'){save.w=1;toast('ذاكرة المتصفح امتلت، بيتحفظ في قاعدة البيانات الداخلية')}};
let uidc=0;const uid=()=>Date.now().toString(36)+(uidc++).toString(36)+Math.random().toString(36).slice(2,6);
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let M=n=>(Math.round(n*100)/100).toLocaleString('en-US')+' ج';
const Mraw=n=>(Math.round(n*100)/100).toLocaleString('en-US')+' ج';
const num=s=>parseFloat(String(s??'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace('٫','.').replace(',','.'));
const $=i=>document.getElementById(i);
const P=i=>S.products.find(p=>p.id===i),C=i=>S.customers.find(c=>c.id===i);
const bal=c=>S.ledger.filter(l=>l.cid===c).reduce((s,l)=>s+(l.type==='OWES'?l.amt:-l.amt),0);
const day0=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
const dt=t=>new Date(t).toLocaleDateString('en-GB');
const r2=n=>Math.round(n*100)/100;
const isLow=p=>p.min>0?p.stock<=p.min:p.stock<=0;
function waNum(p){let d=String(p||'').replace(/[٠-٩]/g,x=>'٠١٢٣٤٥٦٧٨٩'.indexOf(x)).replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0'))d='20'+d.slice(1);return d}
const wa=(p,t)=>'https://wa.me/'+waNum(p)+'?text='+encodeURIComponent(t);
function hap(n){try{navigator.vibrate&&navigator.vibrate(n||10)}catch(_){}}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';t.classList.remove('pop');void t.offsetWidth;t.classList.add('pop');if(/^(تم|اتسجلت)/.test(m)&&!/(الرقم|إلغاء)/.test(m))hap([14,40,14]);clearTimeout(toast.i);toast.i=setTimeout(()=>t.style.display='none',2200)}
function go(t){v={tab:t};cart={};cq='';cnv=0;render()}
function open_(c){v={tab:'cust',cid:c};render()}
function balHTML(b){return b>0?`<span class="red">عليه ${M(b)}</span>`:b<0?`<span class="grn">ليه ${M(-b)}</span>`:'<span class="mu">مسدّد ✓</span>'}
const back=(f,l)=>`<div class="topbar"><button class="backbtn" onclick="${f}">→ ${l||'رجوع'}</button></div>`;
function hp(s){let h=5381;for(const c of String(s))h=(h*33+c.charCodeAt(0))>>>0;return String(h)}
function lockView(){return `<h2>🔒 مندوب المبيعات</h2><input id="pin" type="password" inputmode="numeric" placeholder="الرقم السري" onkeydown="if(event.key==='Enter')unlock()"><button class="btn" onclick="unlock()">دخول</button>`}
function unlock(){if(hp($('pin').value)===S.pin){unl=true;render()}else toast('الرقم غلط')}
function setPin(){const p=prompt('اكتب الرقم السري الجديد:');if(!p)return;S.pin=hp(p);save();unl=true;toast('تم تفعيل القفل');render()}
function rmPin(){S.pin='';save();toast('تم إلغاء القفل');render()}
const AVC=['#1f4d2e','#2a5d8f','#8a5a00','#6b3f7a','#1f6f6a','#8b4a2b','#9a3b5c','#4a4f47'];
function avatar(name,seed){const p=String(name||'؟').trim().split(/\s+/);const ini=((((p[0]||'')[0]||'')+((p[1]||'')[0]||''))).toUpperCase()||'؟';let h=0;String(seed||name||'').split('').forEach(ch=>{h=(h*31+ch.charCodeAt(0))>>>0});return '<span class="av" style="background:'+AVC[h%AVC.length]+'" aria-hidden="true">'+e(ini)+'</span>'}
function screenHead(title,sub,act){return '<div class="sh"><div class="shrow"><div style="min-width:0"><h1>'+title+'</h1>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div>'+(act||'')+'</div></div>'}

function moreView(){return screenHead('المزيد','الأدوات والإعدادات')+`

    <button class="tile" onclick="go('map')"><span class="ti">🗺️</span>الخريطة</button>
    <button class="tile" onclick="go('prod')"><span class="ti">📦</span>المنتجات</button>
    <button class="tile" onclick="v={tab:'today',pg:'rep'};render()"><span class="ti">📈</span>التقارير</button>
    <button class="tile" onclick="v={tab:'today',pg:'debts'};render()"><span class="ti">💰</span>المديونيات</button>
    <button class="tile" onclick="v={tab:'today',pg:'trk'};render()"><span class="ti">🛣</span>خط السير</button>
    <button class="tile" onclick="v={tab:'today',pg:'msg'};render()"><span class="ti">💬</span>رسائل جماعية</button>
    <button class="tile" onclick="v={tab:'cust',imp:1};render()"><span class="ti">📥</span>استيراد عملاء</button>
    <button class="tile" onclick="v={tab:'more',imgs:1};render()"><span class="ti">🖼️</span>الأسعار والكتالوج</button>
    <button class="tile" onclick="v={tab:'today',pg:'set'};render()"><span class="ti">⚙️</span>الإعدادات والنسخ</button>
  </div>
  <p class="mu" style="margin:14px 2px">كل البيانات محفوظة على الموبايل ده. اعمل نسخة احتياطية من الإعدادات بانتظام.</p>`}
function render(){
  const navOf={cov:'cov',cust:'cust',today:'today',ai:'ai',more:'more',map:'more',prod:'more'};
  const act=v.pg==='set'?'more':v.pg?'today':(navOf[v.tab]||'today');
  ['cov','cust','today','ai','more'].forEach(t=>{const b=$('n-'+t);if(b)b.classList.toggle('on',act===t)});
  const sub=!unl||!!(v.cid||v.order||v.cedit||v.addc||v.pf||v.stmt||v.inv||v.imp||v.bulk||v.pick);
  const nv=$('nav');if(nv)nv.classList.toggle('hide',sub);
  let h;
  if(!unl)h=lockView();
  else if(v.imp)h=impView();
  else if(v.imgs)h=imgView();
  else if(v.bulk)h=bulkView();
  else if(v.pick)h=pickView();
  else if(v.pg==='debts')h=debtsView();
  else if(v.pg==='rep')h=repView();
  else if(v.pg==='trk')h=trkView();
  else if(v.pg==='msg')h=msgView();
  else if(v.pg==='set')h=setView();
  else if(v.stmt)h=stmtView();
  else if(v.inv)h=invView();
  else if(v.cedit||v.addc){if(v.cedit&&!C(v.cedit)){v={tab:'cust'};h=custList()}else h=custForm(v.cedit?C(v.cedit):null)}
  else if(v.pf){if(!P(v.pf)){v={tab:'prod'};h=prodView()}else h=prodForm(P(v.pf))}
  else if(v.cid)h=custView();
  else if(v.order)h=orderView();
  else h=v.tab==='cust'?custList():v.tab==='cov'?covView():v.tab==='prod'?prodView():v.tab==='map'?mapView():v.tab==='ai'?aiView():v.tab==='more'?moreView():todayView();
  $('main').innerHTML=h;window.scrollTo(0,0);
}
function summary(){const s=day0(),e2=s+864e5,inr=t=>t>=s&&t<e2;return{v:S.visits.filter(x=>inr(x.t)&&x.auto!==5).length,o:S.orders.filter(x=>!x.cx&&inr(x.t)).length,c:S.ledger.filter(x=>x.type==='PAID'&&inr(x.t)).reduce((a,x)=>a+x.amt,0)}}
function todayView(){
  const d=summary(),owed=S.customers.reduce((s,c)=>s+Math.max(bal(c.id),0),0),need=groups().filter(x=>x.cs.length&&x.st>=2).length,old=(S.customers.length+S.orders.length)>0&&Date.now()-S.lb>6048e5;
  const plan=aiTour();
  const next=S.tourHide===day0()?'<button class="linkbtn" style="display:block;margin:0 auto 10px" onclick="restoreTour()">↩ رجّع اقتراح الجولة</button>':plan.list.length
    ?`<div class="card hero" style="position:relative"><button aria-label="إخفاء" onclick="hideTour()" style="position:absolute;top:10px;left:10px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.18);color:var(--prt);font-size:20px;cursor:pointer">✕</button><div class="mu" style="padding-left:48px">الخطوة الجاية${plan.pinned?' • اختيار المساعد 🤖':plan.alt?' • جولة بديلة':''}</div><div class="hn">ابدأ بجولة مركز ${e(plan.mz)}</div><div class="hs">${e(plan.list.map(x=>gname(x)).join(' • '))}</div><a class="btn" style="background:var(--surf);color:var(--pr);margin:12px 0 0;box-shadow:none" target="_blank" rel="noopener" href="${e(tourHref(plan.list))}">🧭 افتح المسار على الخرائط</a><button class="btn" style="background:transparent;color:var(--prt);box-shadow:inset 0 0 0 2px var(--prt);margin:8px 0 0" onclick="showTour()">🗺 كل عملاء الجولة على الخريطة</button><button class="btn" style="background:transparent;color:var(--prt);box-shadow:inset 0 0 0 2px var(--prt);margin:8px 0 0" onclick="nextTour()">🔄 جولة تانية</button></div>`
    :`<div class="card" style="text-align:center"><div style="font-size:30px">🎉</div><b>مفيش قرى محتاجة زيارة دلوقتي</b><div class="mu">كل قرى عملائك اتزارت في مواعيدها</div></div>`;
  const rep=encodeURIComponent(`تقرير اليوم\nالزيارات: ${d.v}\nالطلبات: ${d.o}\nالتحصيلات: ${d.c} جنيه`);
  return screenHead('اليوم',e(new Date().toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'})))+`
  ${next}
  ${old?`<div class="alert red">⚠ مفيش نسخة احتياطية من أكتر من أسبوع<br><button class="btn sm" style="margin-top:10px;width:auto" onclick="dlBackup()">💾 نزّل نسخة دلوقتي</button></div>`:''}
  ${todayAlerts()}
  ${need?`<button class="alert amb" style="width:100%;display:block;text-align:right;font:inherit;color:inherit;cursor:pointer;border:0" onclick="go('cov')">📍 ${need} قرية محتاجة زيارة</button>`:''}
  <div class="kpis">
    <div class="kpi"><div class="v">${d.v}</div><div class="l">زيارات النهارده</div></div>
    <div class="kpi"><div class="v">${d.o}</div><div class="l">طلبات النهارده</div></div>
    <div class="kpi"><div class="v">${e(M(d.c))}</div><div class="l">تحصيل النهارده</div></div>
    <button class="kpi" onclick="v={tab:'today',pg:'debts'};render()"><div class="v red">${e(M(owed))}</div><div class="l">عليهم فلوس ←</div></button>
  </div>
  <h2>أعمال سريعة</h2>
  <div class="grid3">
    <button class="tile" onclick="go('cov')"><span class="ti">📍</span>الزيارات</button>
    <button class="tile" onclick="v={tab:'today',pg:'msg'};render()"><span class="ti">💬</span>رسائل</button>
    <button class="tile" onclick="v={tab:'today',pg:'trk'};render()"><span class="ti">🛣</span>خط السير</button>

  geoBusy=true;S.vc=S.vc||{};let ok=0,fail=0;const bad=[];
  try{for(let i=0;i<keys.length;i++){const k=keys[i],t=todo[k];toast('بدوّر '+(i+1)+' من '+keys.length+': '+t.vl);
    let r=S.vc[k];if(r&&r.miss&&Date.now()-r.miss<6048e5)r=null;else if(!r||r.miss){r=await geoVillage(t.vl,t.mz);if(r!==undefined){S.vc[k]=r||{miss:Date.now()};save()}await new Promise(x=>setTimeout(x,1100))}

    if(bad.length)alert('مالقيتش مكان لـ '+bad.length+' قرية:\n'+bad.join('\n')+'\n\nسجّل موقع عملاء القرى دي بإيدك من صفحة العميل.')}

  return 'رسالة جاهزة لـ <b>'+e(c.name)+'</b>:<br><span class="mu">'+e(txt)+'</span><br><a class="btn sm" style="margin-top:8px" target="_blank" rel="noopener" href="'+e(wa(c.phone,txt))+'">📲 ابعتها واتساب</a>'}
function aiMsgFor(id){const c=C(id);if(!c)return;aiMsgs.push({bot:1,h:aiMsg(c)});aiRender()}
function aiBal(c){return `${e(c.name)}${c.village?' ('+e(c.village)+')':''}: ${balHTML(bal(c.id))}<br><button class="btn t sm" style="margin-top:8px" onclick="aiGo('${c.id}')">📂 افتح حسابه</button>`}
function aiGo(id){v={tab:'cust',cid:id};cart={};render()}
function aiConfirm(kind,c,amt){const bn=e(c.name)+(c.village?' ('+e(c.village)+')':'');
  if(kind==='collect')return `سجّل تحصيل <b>${e(M(amt))}</b> من <b>${bn}</b>؟<br><button class="btn sm" style="margin-top:8px" onclick="aiAct('collect','${c.id}',${amt})">✅ أيوه، سجّله</button><div class="mu" style="margin-top:6px">رصيده الحالي: ${balHTML(bal(c.id))}</div>`;
  return `سجّل زيارة لـ <b>${bn}</b> النهارده؟<br><button class="btn sm" style="margin-top:8px" onclick="aiAct('visit','${c.id}',0)">✅ أيوه، سجّلها</button>`}
function aiAct(kind,cid,amt){const c=C(cid);if(!c)return;
  if(kind==='collect'){if(!(amt>0))return;if(!confirm('تسجيل تحصيل '+M(amt)+' من '+c.name+'؟'))return;
    S.ledger.push({id:uid(),cid:cid,type:'PAID',amt:amt,t:Date.now(),note:'تحصيل (المساعد)'});autoVisit(cid);save();
    aiMsgs.push({bot:1,h:'✅ اتسجّل تحصيل '+e(M(amt))+' من '+e(c.name)+'. رصيده دلوقتي: '+balHTML(bal(cid))})}
  else{if(!confirm('تسجيل زيارة لـ '+c.name+' النهارده؟'))return;const ok=autoVisit(cid,0);save();
    aiMsgs.push({bot:1,h:ok?'✅ اتسجلت الزيارة لـ '+e(c.name):'الزيارة دي متسجلة النهارده قبل كده'})}
  aiRender()}
function aiLocal(q){
  const n=anorm(q);if(!n)return null;
  const has=re=>re.test(n),c=aiCands(n),amt=aiAmt(n);
  const who=x=>e(x.name)+(x.village?' ('+e(x.village)+')':'');
  const pick=(cs,mk)=>'<div style="margin-top:6px">'+cs.slice(0,6).map(mk).join('')+(cs.length>6?'<div class="mu">فيه غيرهم، اكتب الاسم كامل</div>':'')+'</div>';
  const btn=(x,code)=>`<button class="btn t sm" style="display:block;margin:6px 0" onclick="${code}">${who(x)}</button>`;
  if(has(/ساعد|تقدر|تعمل ايه|اوامر|تعرف تعمل|ايه اللي تعرفه/)&&!c.length)return AI_HELP;
  if(has(/(كام|عدد)/)&&has(/زياره|زرت/)&&has(/النهارده|اليوم/))return aiToday();
  if(has(/حصل|تحصيل|دفع|استلم|خدت فلوس|اخدت فلوس/)){
    if(!amt)return c.length?'كام المبلغ اللي اتحصّل من '+who(c[0])+'؟ اكتب مثلًا: حصّل 300 من '+e(c[0].name)+'.':'اكتب المبلغ واسم العميل، مثلًا: حصّل 300 من أحمد.';
    if(!c.length)return 'تحصيل '+e(M(amt))+'. مين العميل؟ اكتب اسمه.';
    if(c.length===1)return aiConfirm('collect',c[0],amt);
    return 'في أكتر من عميل بالاسم ده، اختار:'+pick(c,x=>btn(x,`aiAct('collect','${x.id}',${amt})`))}
  if(has(/سجل|زرت|اتزار|اتزرت/)&&c.length){
    if(c.length===1)return aiConfirm('visit',c[0],0);
    return 'في أكتر من عميل بالاسم ده، اختار:'+pick(c,x=>btn(x,`aiAct('visit','${x.id}',0)`))}
  if(has(/مسار|طريق|روت|وصلني|خريطه|خط السير/))return aiRoute();
  if(has(/قرى|قريه|جوله|مزرتش|مزرتهاش|ما اتزار|مش اتزار|متزار|محتاج|متاخره|لم تزر|زور/))return aiVisits();
  if(has(/سجل|زرت|اتزار|اتزرت/))return 'سجّل زيارة لمين؟ اكتب اسم العميل.';
  if(has(/رساله|تذكير|ابعت|اكتب|واتساب/)){
    if(!c.length)return 'اكتب اسم العميل اللي عايز الرسالة ليه.';
    if(c.length===1)return aiMsg(c[0]);
    return 'في أكتر من عميل بالاسم ده، اختار:'+pick(c,x=>btn(x,`aiMsgFor('${x.id}')`))}
  if(has(/رصيد|كشف|فاضل|فاضلي/)){
    if(!c.length)return 'معرفتش العميل ده. اكتب اسمه زي ما هو في الجهات، أو القرية.';
    if(c.length===1)return aiBal(c[0]);
    return 'في أكتر من عميل بالاسم ده، اختار:'+pick(c,x=>btn(x,`aiGo('${x.id}')`))}
  if(has(/كام عليه|عليه كام|كام ليه|ليه كام|مين عليه|مين عليهم|مديون|ديون|عليهم فلوس|عليه فلوس|اكبر مدين|اكتر واحد عليه|متاخرين في/)){
    if(c.length===1)return aiBal(c[0]);
    if(c.length>1)return 'في أكتر من عميل بالاسم ده، اختار:'+pick(c,x=>btn(x,`aiGo('${x.id}')`));
    return aiDebts()}
  if(has(/مخزون|يخلص|خلص|قرب|ناقص|نفد|نفذ|متبقي/)){
    const pc=aiProdCands(n);
    if(pc.length===1)return aiProd(pc[0]);
    if(pc.length>1)return 'اخترت أي منتج؟<br>'+pc.slice(0,6).map(p=>'• '+aiProd(p)).join('<br>');
    return aiLow()}
  if(has(/اقترح|اقتراح|خطط|خطه|ابدا منين|نعمل ايه|اعمل ايه|ايه اللي (اعمل|نعمل|اشتغل|اعملها)|اولويه|اولوية/))return aiPlan();
  if(has(/ملخص|النهارده|اليوم|حصيله|نتيجه/))return aiToday();
  if(c.length===1)return aiBal(c[0]);
  if(c.length>1)return 'في أكتر من عميل بالاسم ده، اختار:'+pick(c,x=>btn(x,`aiGo('${x.id}')`));
  return null}
function aiPlan(){const d0=day0(),vis=S.visits.filter(x=>x.t>=d0).length,t=aiTour(),L=[];
  L.push('<b>خطة النهارده:</b>');
  if(t.list.length){L.push('1) ابدأ من '+e(S.home?S.home.n:'موقعك')+' وروح جولة مركز '+e(t.mz)+': '+t.list.map(x=>e(gname(x))).join('، ')+'.');
    L.push('<a class="btn sm" style="margin-top:6px" target="_blank" rel="noopener" href="'+e(tourHref(t.list))+'">🧭 افتح المسار على الخرائط</a>')}
  else L.push('1) مفيش قرى محتاجة زيارة دلوقتي، كمّل على متابعة عملاءك.');
  const debt=S.customers.map(c=>({c,b:bal(c.id)})).filter(x=>x.b>0).sort((a,b)=>b.b-a.b).slice(0,3);
  if(debt.length)L.push('2) تابع الحسابات: '+debt.map(x=>e(x.c.name)+' ('+e(M(x.b))+')').join('، ')+'.');
  const low=S.products.filter(p=>isLow(p));
  if(low.length)L.push('3) راجع المخزون: '+low.length+' منتج خلص أو قرب، أولهم '+low.slice(0,3).map(p=>e(p.name)).join('، ')+'.');
  L.push(vis?'سجّلت '+vis+' زيارة لحد دلوقتي النهارده.':'لسه مسجلتش زيارات النهارده. سجّل كل زيارة من صفحة العميل بعد ما تخلص.');
  return L.join('<br>')}
function aiContext(q){const d0=day0(),vis=S.visits.filter(x=>x.t>=d0).length,ord=S.orders.filter(o=>!o.cx&&o.t>=d0).length,col=S.ledger.filter(l=>l.type==='PAID'&&l.t>=d0).reduce((a,l)=>a+l.amt,0);
  const debt=S.customers.map(c=>({c,b:bal(c.id)})).filter(x=>x.b>0).sort((a,b)=>b.b-a.b).slice(0,5);
  const low=S.products.filter(p=>isLow(p)).slice(0,8);
  const need=groups().filter(x=>x.cs.length&&x.st>=2).sort((a,b)=>b.st-a.st||(b.days||0)-(a.days||0)).slice(0,6);
  const tk=aiToks(anorm(q));const hit=S.customers.filter(c=>{const h=anorm(c.name);return tk.some(t=>aiTokMatch(h,t))}).slice(0,5);
  const L=['تاريخ اليوم: '+new Date().toLocaleDateString('en-GB'),'النهارده: '+vis+' زيارة، '+ord+' طلب، تحصيل '+r2(col)+' جنيه.'];
  L.push('أكبر المديونيات: '+(debt.map(x=>x.c.name+' ('+(x.c.village||x.c.mz||'-')+') عليه '+r2(x.b)).join('؛')||'مفيش'));
  L.push('منتجات قربت تخلص: '+(low.map(p=>p.name+' متاح '+r2(p.stock)).join('؛')||'مفيش'));
  L.push('قرى محتاجة زيارة: '+(need.map(x=>gname(x)+' ('+stTxt(x)[0]+')').join('؛')||'مفيش'));
  if(hit.length)L.push('عملاء ذكروا في السؤال: '+hit.map(c=>c.name+' ('+(c.village||'-')+'، '+(c.mz||'-')+') رصيده '+r2(bal(c.id))).join('؛'));
  return 'البيانات:\n'+L.join('\n')}
async function aiCloudAnthropic(q,key){const ctx=aiContext(q);let r;
  try{r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-haiku-5-5',max_tokens:600,system:AI_SYS,messages:[{role:'user',content:ctx+'\n\nسؤال المندوب: '+q}]})})}
  catch(_){throw new Error('مفيش اتصال بالإنترنت، جرّب بعدين')}
  if(r.status===401||r.status===403)throw new Error('المفتاح غلط أو مش شغال');
  if(!r.ok)throw new Error('الخدمة رجعت خطأ '+r.status+'، جرّب بعدين');
  const j=await r.json();return ((j&&j.content)||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim()||'مرجعش رد'}
function aiProv(){return aiKey().indexOf('sk-ant')===0?'anthropic':'google'}
function aiModel(){try{return localStorage.getItem('fs_ai_model')||'gemini-2.5-flash'}catch(_){return 'gemini-2.5-flash'}}
let aiModelList=[],aiListErr='';
async function aiListModels(key){const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',{headers:{'x-goog-api-key':key}});
  if(!r.ok){aiModelList=[];aiListErr='كود '+r.status;throw new Error(aiListErr)}
  const j=await r.json();
  const names=((j&&j.models)||[]).filter(m=>(m.supportedGenerationMethods||[]).indexOf('generateContent')>=0).map(m=>String(m.name||'').replace(/^models\//,'')).filter(n=>/gemini/i.test(n)&&!/embed|tts|image|imagen|aqa|veo|live|audio|robotics|computer|gemma|learnlm/i.test(n));
  aiModelList=names;aiListErr='';return names}
function aiRankModels(names){
  const ver=n=>parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/)||[0,0])[1])||0;
  const rank=n=>[/flash/i.test(n)?0:1,/preview|exp/i.test(n)?1:0,/lite/i.test(n)?1:0,-ver(n)];
  const cmp=(a,b)=>{const x=rank(a),y=rank(b);for(let i=0;i<x.length;i++){if(x[i]!==y[i])return x[i]-y[i]}return a<b?-1:(a>b?1:0)};
  return names.slice().sort(cmp)}
function aiModelsHTML(){if(!aiModelList.length)return aiListErr?'<p class="red">قايمة الموديلات رجعت '+e(aiListErr)+'</p>':'';
  return '<div class="card"><b>اختار موديل:</b>'+aiModelList.map(n=>`<button class="btn t sm" style="display:block;margin:6px 0" onclick="aiUseModel('${n}')">${e(n)}</button>`).join('')+'</div>'}
async function aiShowModels(){const key=aiKey();if(!key){toast('ضيف المفتاح الأول واحفظه');return}
  try{const names=await aiListModels(key);toast(names.length?'اتجابت '+names.length+' موديل':'مفيش موديلات نصية متاحة للمفتاح ده')}
  catch(err){toast('مقدرتش أجيب قايمة الموديلات ('+((err&&err.message)||'')+')')}
  render()}
function aiUseModel(n){try{localStorage.setItem('fs_ai_model',n)}catch(_){}toast('الموديل بقى: '+n);render()}
async function aiCloudGoogle(q,key){const ctx=aiContext(q);let model=aiModel();
  const body={systemInstruction:{parts:[{text:AI_SYS}]},contents:[{role:'user',parts:[{text:ctx+'\n\nسؤال المندوب: '+q}]}],generationConfig:{maxOutputTokens:1500,temperature:0.3}};
  const send=url=>fetch(url,{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':key},body:JSON.stringify(body)});
  const gen=m=>'https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(m)+':generateContent';
  const vert=m=>'https://aiplatform.googleapis.com/v1/publishers/google/models/'+encodeURIComponent(m)+':generateContent';
  const aq=key.indexOf('AQ.')===0;
  let r;
  try{r=await send(gen(model))}catch(_){throw new Error('مفيش اتصال بالإنترنت، جرّب بعدين')}
  if(r.status===404){let names=[];try{names=await aiListModels(key)}catch(_){}
    const cands=aiRankModels(names).filter(n=>n!==model).slice(0,3);
    for(let i=0;i<cands.length&&r.status===404;i++){try{const r3=await send(gen(cands[i]));if(r3.ok){model=cands[i];r=r3;try{localStorage.setItem('fs_ai_model',model)}catch(_){}}}catch(_){}}}
  if(!r.ok&&aq&&(r.status===400||r.status===403||r.status===404)){try{const r2=await send(vert(model));if(r2.ok)r=r2}catch(_){}}
  if(r.status===400||r.status===401)throw new Error('المفتاح غلط أو شكله مش مقبول (كود '+r.status+'). جرّب مفتاح جديد من Google AI Studio');
  if(r.status===403)throw new Error('الطلب اتمنع (كود 403): ممكن المفتاح عليه قيود مواقع، أو الـ Gemini API مش مفعّلة له. جرّب مفتاح من غير قيود');
  if(r.status===404)throw new Error('مفيش موديل متاح للمفتاح ده (كود 404)'+(aiModelList.length?'. الموديلات اللي المفتاح شايفها: '+aiModelList.slice(0,6).join('، '):(aiListErr?'، وقايمة الموديلات رجعت '+aiListErr:''))+'. اضغط 🔍 في الإعدادات عشان تشوف الموديلات المتاحة لحسابك');
  if(r.status===429)throw new Error('وصلت للحد المسموح للمفتاح دلوقتي، جرّب بعد شوية');
  if(!r.ok)throw new Error('الخدمة رجعت خطأ '+r.status+'، جرّب بعدين');
  const j=await r.json();const c=((j&&j.candidates)||[])[0]||{};
  const txt=((c.content&&c.content.parts)||[]).map(p=>p.text||'').join('\n').trim();
  if(!txt&&c.finishReason==='MAX_TOKENS')return 'الرد طلع أطول من المسموح، اسأل سؤال أقصر';
  return txt||'مرجعش رد'}
async function aiAsk(t){t=String(t==null?'':t).trim();if(!t)return;
  aiMsgs.push({me:1,h:e(t)});
  let local=null;try{local=aiLocal(t)}catch(err){console.error('aiLocal',err)}
  if(local!==null&&local!==undefined){aiMsgs.push({bot:1,h:local});return aiRender()}
  const key=aiKey();
  if(!key||!S.aiOk){aiMsgs.push({bot:1,h:AI_HELP});return aiRender()}
  const idx=aiMsgs.length;aiMsgs.push({bot:1,h:'<span class="mu">بفكّر...</span>'});aiRender();
  try{const txt=await (aiProv()==='anthropic'?aiCloudAnthropic(t,key):aiCloudGoogle(t,key));aiMsgs[idx]={bot:1,h:e(txt).replace(/\n/g,'<br>')}}
  catch(err){aiMsgs[idx]={bot:1,h:'<span class="red">'+e(err&&err.message?err.message:'حصلت مشكلة')+'</span>'}}
  aiRender()}
function aiSend(){const i=$('aiin');const t=i?i.value:'';if(i)i.value='';return aiAsk(t)}
function aiQuick(i){return aiAsk(AI_CHIPS[i])}
function aiClear(){aiMsgs=[{bot:1,h:AI_GREET}];aiRender()}
function aiRender(){render();if(v.tab==='ai'){try{window.scrollTo(0,document.body.scrollHeight)}catch(_){}}}
function aiStatus(){let nm='Gemini';try{const pv=aiProv();if(pv==='anthropic')nm='Claude';else if(pv==='openai'){const cfg=axCfg()||{};nm=(typeof AXPRE!=='undefined'&&AXPRE[cfg.preset]&&AXPRE[cfg.preset].n)||'API'}}catch(_){}
  if(aiKey()&&S.aiOk)return '🟢 الذكاء الاصطناعي شغال ('+nm+')، والأسئلة اللي مش مفهومة بتتبعت بمفتاحك.';
  if(aiKey())return '🟡 المفتاح محفوظ، بس خانة الموافقة مش متعلّمة في الإعدادات، فالمساعد محلي.';
  return '⚪ المساعد محلي (من غير إنترنت). لو عايز الذكاء الاصطناعي، ضيف مفتاح في الإعدادات.'}
function aiView(){const cloud=!!aiKey()&&!!S.aiOk;
  return `<h2>🤖 المساعد</h2>
  <p class="mu" style="margin-top:-8px">${aiStatus()}</p>
  <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">${AI_CHIPS.map((c,i)=>`<button class="btn t sm" style="width:auto;display:inline-block;margin:0" onclick="aiQuick(${i})">${e(c)}</button>`).join('')}</div>
  <div id="aichat">${aiMsgs.map(m=>`<div class="card" style="${m.me?'margin-right:24px;background:var(--pr);color:var(--prt)':'margin-left:24px'}">${m.h}</div>`).join('')}</div>
  <div class="row" style="align-items:stretch"><input id="aiin" placeholder="اكتب سؤالك..." onkeydown="if(event.key==='Enter')aiSend()"><button class="btn" style="flex:none;width:auto;padding:0 18px;margin:0 0 10px" onclick="aiSend()">إرسال</button></div>
  <button class="btn t sm" onclick="aiClear()">🧹 امسح المحادثة</button>`}
</script>
