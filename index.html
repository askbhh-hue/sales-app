<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="المندوب">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>مندوب المبيعات - بني سويف</title>
<style>
:root{--bg:#f6f8f5;--card:#fff;--tx:#17211a;--mu:#5d6b61;--pr:#2e7d32;--prt:#fff;--bd:#d9e1d9;--red:#c62828;--grn:#2e7d32;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101611;--card:#1a231c;--tx:#e8efe9;--mu:#9aa89d;--pr:#66bb6a;--prt:#0b140c;--bd:#2c3a2e;--red:#ef7a7a;--grn:#81c784}}
:root[data-theme="dark"]{--bg:#101611;--card:#1a231c;--tx:#e8efe9;--mu:#9aa89d;--pr:#66bb6a;--prt:#0b140c;--bd:#2c3a2e;--red:#ef7a7a;--grn:#81c784}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.5 system-ui,"Segoe UI",Tahoma,Arial,sans-serif;padding-bottom:96px}
main{max-width:640px;margin:0 auto;padding:14px}
h2{margin:6px 0 12px;font-size:22px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.btn{display:block;width:100%;min-height:60px;border:0;border-radius:14px;background:var(--pr);color:var(--prt);font-family:inherit;font-size:18px;font-weight:600;margin-bottom:10px;cursor:pointer;text-align:center;text-decoration:none;padding:14px;line-height:1.3}
.btn.t{background:var(--card);color:var(--tx);border:2px solid var(--pr)}
.btn.sm{min-height:46px;font-size:15px;margin:0;padding:8px}
.btn.dg{border-color:var(--red);color:var(--red)}
.btn:disabled,.btn.off{opacity:.45;pointer-events:none}
input,select,textarea{width:100%;min-height:54px;font:inherit;padding:10px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);margin-bottom:10px}
.stat{display:flex;justify-content:space-between;align-items:center;font-size:20px}.stat b{font-size:28px}
.mu{color:var(--mu);font-size:15px}.red{color:var(--red)}.grn{color:var(--grn)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:right;font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:8px;min-height:64px;cursor:pointer}
.big{font-size:40px;font-weight:700;text-align:center}
.qb{flex:none!important;width:46px;height:46px;border-radius:50%;border:2px solid var(--pr);background:none;color:var(--tx);font-size:24px;cursor:pointer}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;min-width:0;min-height:72px;border:0;background:none;color:var(--mu);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
nav button.on{color:var(--pr)}nav i{display:block;font-style:normal;font-size:26px}
#toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 20px;border-radius:12px;display:none;z-index:9}
pre{white-space:pre-wrap;font:inherit;margin:0}
@media print{nav,.btn,#toast{display:none!important}body{padding:0}}
</style>
</head>
<body>
<main id="main"></main>
<nav><button id="n-cov" onclick="go('cov')"><i>📍</i>الزيارات</button><button id="n-cust" onclick="go('cust')"><i>👥</i>العملاء</button><button id="n-today" onclick="go('today')"><i>📊</i>اليوم</button><button id="n-map" onclick="go('map')"><i>🗺️</i>الخريطة</button><button id="n-ai" onclick="go('ai')"><i>🤖</i>المساعد</button><button id="n-prod" onclick="go('prod')"><i>📦</i>المنتجات</button></nav>
<div id="toast"></div>
<script>
const K='fs_v1',CATS=['أسمدة','مبيدات'],UNITS=['شيكارة','زجاجة','لتر','كيلو','علبة','كيس','عبوة'],MZ=['بني سويف','ناصر','إهناسيا','ببا','الفشن','سمسطا','الواسطى','الفيوم'];
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(_){}
function fix(){S=S||{};['products','customers','orders','ledger','visits'].forEach(k=>S[k]=S[k]||[]);S.pin=S.pin||'';S.lb=S.lb||0;S.pv=S.pv||[];S.places=S.places||[];S.cyc=S.cyc||14;S.hide=S.hide||[];S.msgLog=S.msgLog||[];S.home=S.home||{n:'أطواب',mz:'الواسطى'};S.products.forEach(p=>{if(!CATS.includes(p.cat))p.cat='أسمدة'})}
function migrate(){if(S.mig)return;S.orders.forEach(o=>{if(o.cx||!(o.paid>0))return;const l=S.ledger.find(x=>x.oid===o.id&&x.type==='OWES');
  if(l){if(Math.abs(l.amt-(o.total-o.paid))<0.01)l.amt=o.total}else S.ledger.push({id:uid(),cid:o.cid,type:'OWES',amt:o.total,t:o.t,oid:o.id,note:'طلب'})});S.mig=1;save()}
fix();
let v={tab:'cov'},cart={},rp='w',unl=!S.pin,cq='';
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(_){toast('تعذر الحفظ على المتصفح')}};
let uidc=0;const uid=()=>Date.now().toString(36)+(uidc++).toString(36)+Math.random().toString(36).slice(2,6);
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M=n=>(Math.round(n*100)/100).toLocaleString('en-US')+' ج';
const num=s=>parseFloat(String(s??'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace('٫','.').replace(',','.'));
const $=i=>document.getElementById(i);
const P=i=>S.products.find(p=>p.id===i),C=i=>S.customers.find(c=>c.id===i);
const bal=c=>S.ledger.filter(l=>l.cid===c).reduce((s,l)=>s+(l.type==='OWES'?l.amt:-l.amt),0);
const day0=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
const dt=t=>new Date(t).toLocaleDateString('en-GB');
const r2=n=>Math.round(n*100)/100;
const isLow=p=>p.min>0?p.stock<=p.min:p.stock<=0;
function waNum(p){let d=String(p||'').replace(/[٠-٩]/g,x=>'٠١٢٣٤٥٦٧٨٩'.indexOf(x)).replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0'))d='20'+d.slice(1);return d}
const wa=(p,t)=>'https://wa.me/'+waNum(p)+'?text='+encodeURIComponent(t);
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function go(t){v={tab:t};cart={};cq='';cnv=0;render()}
function open_(c){v={tab:'cust',cid:c};render()}
function balHTML(b){return b>0?`<span class="red">عليه ${M(b)}</span>`:b<0?`<span class="grn">ليه ${M(-b)}</span>`:'<span class="mu">صفر</span>'}
const back=(f,l)=>`<button class="btn t" onclick="${f}">→ ${l||'رجوع'}</button>`;

// ---------- LOCK ----------
function hp(s){let h=5381;for(const c of String(s))h=(h*33+c.charCodeAt(0))>>>0;return String(h)}
function lockView(){return `<h2>🔒 مندوب المبيعات</h2><input id="pin" type="password" inputmode="numeric" placeholder="الرقم السري" onkeydown="if(event.key==='Enter')unlock()"><button class="btn" onclick="unlock()">دخول</button>`}
function unlock(){if(hp($('pin').value)===S.pin){unl=true;render()}else toast('الرقم غلط')}
function setPin(){const p=prompt('اكتب الرقم السري الجديد:');if(!p)return;S.pin=hp(p);save();unl=true;toast('تم تفعيل القفل');render()}
function rmPin(){S.pin='';save();toast('تم إلغاء القفل');render()}

function render(){
  ['today','cust','cov','prod','map','ai'].forEach(t=>$('n-'+t).classList.toggle('on',v.tab===t));
  let h;
  if(!unl)h=lockView();
  else if(v.imp)h=impView();
  else if(v.bulk)h=bulkView();
  else if(v.pick)h=pickView();
  else if(v.pg==='debts')h=debtsView();
  else if(v.pg==='rep')h=repView();
  else if(v.pg==='trk')h=trkView();
  else if(v.pg==='msg')h=msgView();
  else if(v.pg==='set')h=setView();
  else if(v.stmt)h=stmtView();
  else if(v.inv)h=invView();
  else if(v.cedit||v.addc)h=custForm(v.cedit?C(v.cedit):null);
  else if(v.pf)h=prodForm(P(v.pf));
  else if(v.cid)h=custView();
  else if(v.order)h=orderView();
  else h=v.tab==='cust'?custList():v.tab==='cov'?covView():v.tab==='prod'?prodView():v.tab==='map'?mapView():v.tab==='ai'?aiView():todayView();
  $('main').innerHTML=h;window.scrollTo(0,0);
}

// ---------- TODAY / SETTINGS / BACKUP ----------
function summary(){const s=day0(),e2=s+864e5,inr=t=>t>=s&&t<e2;
  return{v:S.visits.filter(x=>inr(x.t)&&x.auto!==5).length,o:S.orders.filter(x=>!x.cx&&inr(x.t)).length,c:S.ledger.filter(x=>x.type==='PAID'&&inr(x.t)).reduce((a,x)=>a+x.amt,0)}}
function todayView(){const d=summary(),owed=S.customers.reduce((s,c)=>s+Math.max(bal(c.id),0),0),low=S.products.filter(isLow).length,need=groups().filter(x=>x.cs.length&&x.st>=2).length,old=(S.customers.length+S.orders.length)>0&&Date.now()-S.lb>6048e5;
  return `<h2>ملخص اليوم</h2>
  ${todayAlerts()}
  ${old?`<div class="card" style="border-color:var(--red)">⚠ مفيش نسخة احتياطية من أكتر من أسبوع<button class="btn" style="margin:10px 0 0" onclick="dlBackup()">💾 نزّل نسخة احتياطية دلوقتي</button></div>`:''}
  <div class="card stat">الزيارات<b>${d.v}</b></div>
  <div class="card stat">الطلبات<b>${d.o}</b></div>
  <div class="card stat">التحصيلات<b>${M(d.c)}</b></div>
  <button class="btn t" onclick="v={tab:'today',pg:'debts'};render()">💰 المديونيات (${M(owed)})</button>
  <button class="btn t" onclick="v={tab:'today',pg:'rep'};render()">📈 التقارير</button>
  <button class="btn t" onclick="v={tab:'today',pg:'trk'};render()">🛣 خط السير والمقارنة</button>
  <button class="btn t" onclick="v={tab:'today',pg:'msg'};render()">💬 رسائل جماعية للعملاء</button>
  ${need?`<button class="btn t" onclick="go('cov')">📍 ${need} قرية محتاجة زيارة</button>`:''}
  ${low?`<button class="btn t" onclick="go('prod')">⚠ ${low} منتج قرب يخلص</button>`:''}
  <a class="btn t" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(`تقرير اليوم\nالزيارات: ${d.v}\nالطلبات: ${d.o}\nالتحصيلات: ${d.c} جنيه`)}">📤 ابعت تقرير اليوم واتساب</a>
  <button class="btn t" onclick="v={tab:'today',pg:'set'};render()">⚙️ الإعدادات والنسخ الاحتياطي</button>`}
function setView(){return `${back("go('today')")}<h2>النسخ الاحتياطي</h2>
  <p class="mu">آخر نسخة: ${S.lb?dt(S.lb):'لسه مفيش'}</p>
  <button class="btn" onclick="dlBackup()">💾 تنزيل نسخة احتياطية (ملف)</button>
  <label class="btn t" style="cursor:pointer">📂 استرجاع من ملف<input type="file" accept=".json,application/json" style="display:none" onchange="restoreFile(this.files[0])"></label>
  <button class="btn t" onclick="backup()">📋 نسخ البيانات كنص</button>
  <button class="btn t" onclick="restore()">📥 استرجاع من نص</button>
  <h2>نقطة الانطلاق</h2>
  <p class="mu">كل المسارات في خرائط جوجل بتبدأ من: <b>${e(S.home.n)}</b>${S.home.mz?' ('+e(S.home.mz)+')':''}${S.home.lat!=null?' ✓':''}</p>
  <button class="btn t" onclick="setHome()">📍 غيّر نقطة الانطلاق</button>
  <h2>تسجيل الزيارات تلقائيًا</h2>
  <p class="mu">لما تفتح التطبيق وانت عند عملاء، بيقارن موقعك بمواقعهم المسجلة ويسجل الزيارة لوحده. الموقع بيتشيك وقت الفتح بس، مش في الخلفية.</p>
  <button class="btn t" onclick="toggleAuto()">🛰 التسجيل التلقائي: ${S.auto?'شغال ✅':'مقفول'}</button>
  <h2>تتبع خط السير</h2>
  <p class="mu">بيسجّل مكانك كل 4 دقايق طول ما التطبيق مفتوح، وبيقارن مشوارك الفعلي بخطة النهارده.</p>
  <button class="btn t" onclick="toggleTrk()">🛣 التتبع: ${S.trkOn?'شغال ✅':'مقفول'}</button>
  <h2>🤖 الذكاء الاصطناعي (اختياري)</h2>
  <p class="mu">المساعد بيشتغل من غير إنترنت ومن غير مفتاح. لو فعّلت الذكاء الاصطناعي، الأسئلة اللي مش مفهومة محليًا بتتبعت للذكاء الاصطناعي باستخدام مفتاحك (Google Gemini أو Anthropic، والمزوّد بيتعرف من شكل المفتاح)، ومعاها أسماء وأرصدة العملاء المتعلقين بالسؤال، من غير أرقام التليفون. المفتاح بيتحفظ على الموبايل ده بس، ومش بيدخل في النسخة الاحتياطية.</p>
  <p class="mu" style="margin:6px 0"><b>الحالة:</b> ${aiStatus()}</p>
  <input id="aik" type="password" placeholder="${aiKey()?'المفتاح محفوظ ✅ (اكتب مفتاح جديد لو عايز تغيّره)':'مفتاح API (Google Gemini أو Anthropic)'}">
  <input id="aim" placeholder="اسم موديل Gemini (اختياري)" value="${e(aiModel())}">
  <label class="mu" style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><input id="aiok" type="checkbox" ${S.aiOk?'checked':''} style="width:24px;height:24px;min-width:24px;min-height:24px;margin:0;flex:none"> أوافق إن الأسئلة اللي مش مفهومة تتبعت للذكاء الاصطناعي</label>
  <button class="btn t" onclick="aiSave()">💾 حفظ إعدادات المساعد</button>
  ${aiKey()?'<button class="btn t dg" onclick="aiForget()">🗑 امسح المفتاح</button>':''}
  <h2>قفل التطبيق</h2>
  <p class="mu">${S.pin?'القفل شغال.':'القفل مقفول.'} الرقم السري بيمنع أي حد يفتح الموقع على موبايلك، لكنه مش تشفير للبيانات.</p>
  <button class="btn t" onclick="setPin()">${S.pin?'🔑 تغيير الرقم السري':'🔒 تفعيل رقم سري'}</button>
  ${S.pin?'<button class="btn t" onclick="rmPin()">🔓 إلغاء القفل</button>':''}
  <h2>التثبيت كتطبيق</h2><p class="mu">من قايمة المتصفح اختار Add to Home Screen.</p>`}
function dlBackup(){try{const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sales-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();S.lb=Date.now();save();toast('تم تنزيل النسخة');render()}catch(_){backup()}}
async function backup(){try{await navigator.clipboard.writeText(JSON.stringify(S));S.lb=Date.now();save();toast('تم النسخ، الصقه في ملاحظات أو واتساب')}catch(_){prompt('انسخ النص ده واحفظه:',JSON.stringify(S))}}
function applyBackup(t){try{const d=JSON.parse(t);if(!d.customers||!d.products)throw 0;if(!confirm('هتستبدل كل البيانات الحالية بالنسخة دي؟'))return;S=d;fix();unl=true;save();toast('تم الاسترجاع');go('today')}catch(_){toast('النص غير صالح')}}
function restore(){const t=prompt('الصق النسخة الاحتياطية:');if(t)applyBackup(t)}
function restoreFile(f){if(!f)return;const r=new FileReader();r.onload=()=>applyBackup(String(r.result));r.readAsText(f)}

// ---------- DEBTS / REPORTS ----------
function debtsView(){const l=S.customers.map(c=>({c,b:bal(c.id)})).filter(x=>x.b>0).sort((a,b)=>b.b-a.b),tot=l.reduce((s,x)=>s+x.b,0);
  return `${back("go('today')")}<h2>المديونيات</h2><div class="card stat">إجمالي اللي ليك عند العملاء<b class="red">${M(tot)}</b></div>
  ${l.map(({c,b})=>`<div class="card"><div class="stat" style="font-size:18px"><span><b>${e(c.name)}</b><br><span class="mu">${e([c.village,c.mz].filter(Boolean).join(' - '))}</span>${lateTag(c.id)}</span><b class="red" style="font-size:22px">${M(b)}</b></div><div class="row" style="margin-top:10px"><button class="btn t sm" onclick="open_('${c.id}')">فتح الحساب</button><a class="btn t sm" target="_blank" rel="noopener" href="${e(wa(c.phone,`السلام عليكم يا ${c.name}، بخصوص حسابك: المتبقي ${r2(b)} جنيه. ياريت تسوّيه وقت ما تقدر. شكرًا لتعاملك معانا 🌾`))}">📲 تذكير واتساب</a></div></div>`).join('')||'<p class="mu">مفيش مديونيات 🎉</p>'}`}
function repView(){const now=Date.now(),st={d:day0(),w:now-6048e5,m:now-2592e6,a:0}[rp];
  const os=S.orders.filter(o=>!o.cx&&o.t>=st),col=S.ledger.filter(l=>l.type==='PAID'&&l.t>=st).reduce((a,l)=>a+l.amt,0),sales=os.reduce((a,o)=>a+o.total,0);
  const pr={},cu={};os.forEach(o=>{cu[o.cid]=(cu[o.cid]||0)+o.total;o.items.forEach(i=>{const x=pr[i.name]=pr[i.name]||{q:0,r:0};x.q+=i.qty;x.r+=i.qty*i.price})});
  const top=(m,f)=>Object.entries(m).sort((a,b)=>f(b[1])-f(a[1])).slice(0,5);
  return `${back("go('today')")}<h2>التقارير</h2>
  <select onchange="rp=this.value;render()">${[['d','النهارده'],['w','آخر 7 أيام'],['m','آخر 30 يوم'],['a','الكل']].map(([k,l])=>`<option value="${k}"${k===rp?' selected':''}>${l}</option>`).join('')}</select>
  <div class="card stat">المبيعات<b>${M(sales)}</b></div><div class="card stat">التحصيلات<b>${M(col)}</b></div><div class="card stat">عدد الطلبات<b>${os.length}</b></div>
  <h2>أكتر المنتجات مبيعًا</h2>${top(pr,x=>x.r).map(([n,x])=>`<div class="card">${e(n)} <span class="mu">• ${r2(x.q)} وحدة • ${M(x.r)}</span></div>`).join('')||'<p class="mu">مفيش بيانات</p>'}
  <h2>أكتر العملاء شراءً</h2>${top(cu,x=>x).map(([id,x])=>`<div class="card" style="cursor:pointer" onclick="open_('${id}')">${e((C(id)||{}).name)} <span class="mu">• ${M(x)}</span></div>`).join('')||'<p class="mu">مفيش بيانات</p>'}`}

// ---------- CUSTOMERS ----------
let cnv=0;
const seenSet=()=>{const z=new Set();S.visits.forEach(x=>z.add(x.cid));S.orders.forEach(o=>{if(!o.cx)z.add(o.cid)});return z};
function custCards(q){q=(q||'').trim();const sv=seenSet();
  const l=S.customers.filter(c=>(!q||[c.name,c.village,c.shop,c.crop,c.mz].join(' ').includes(q))&&(!cnv||!sv.has(c.id)));
  return l.length?l.map(c=>`<button class="item" onclick="open_('${c.id}')"><span><b>${e(c.name)}</b><br><span class="mu">${e([c.shop,c.village,c.mz,c.crop].filter(Boolean).join(' - '))}${sv.has(c.id)?'':' • 🔴 لم يُزر'}</span></span><b>${balHTML(bal(c.id))}</b></button>`).join(''):'<p class="mu">مفيش عملاء</p>'}

  <input id="pm" type="number" inputmode="decimal" placeholder="حد التنبيه: نبّهني لو الكمية وصلت لرقم..." value="${p.min||''}"><input id="pa" placeholder="التركيب / المادة الفعالة" value="${e(p.ai||'')}">`}
function prodView(){const low=S.products.filter(isLow);
  return `${S.seedNote?`<div class="card"><b>📦 اتضافت ${S.seedNote} منتج من الكتالوج</b><div class="mu" style="margin:6px 0">أسمدة ومبيدات، والتركيب مكتوب تحت كل منتج. الأسعار والكميات مش في الصور فكلها صفر، اضغط ✎ وحدّد السعر. العبوة مكتوبة "عبوة"، غيّرها لو بتتباع بوحدة تانية.</div><button class="btn t sm" onclick="S.seedNote=0;save();render()">تمام</button></div>`:''}<details class="card"><summary style="min-height:44px;font-weight:700">➕ منتج جديد</summary>${prodFields({})}<button class="btn" onclick="saveP()">حفظ</button></details>
  ${low.length?`<div class="card" style="border-color:var(--red)">⚠ قرب يخلص: ${e(low.map(p=>p.name).join('، '))}</div>`:''}
  ${CATS.map(c=>{const l=S.products.filter(p=>p.cat===c);return l.length?`<h2>${c}</h2>`+l.map(p=>`<div class="item" style="cursor:default"><span><b>${e(p.name)}</b>${isLow(p)?' ⚠':''}<br><span class="mu">${p.price>0?M(p.price)+' / '+p.unit:'⚠ حدّد السعر • '+p.unit}</span>${p.ai?'<br><span class="mu" style="font-size:13px">'+e(p.ai.length>75?p.ai.slice(0,75)+'…':p.ai)+'</span>':''}</span><span style="display:flex;gap:8px;align-items:center"><b style="font-size:24px" class="${isLow(p)?'red':''}">${p.stock}</b><button class="qb" onclick="restock('${p.id}')">＋</button><button class="qb" onclick="v={tab:'prod',pf:'${p.id}'};render()">✎</button></span></div>`).join(''):''}).join('')||'<p class="mu">ضيف أول منتج</p>'}`}
function prodForm(p){return `${back("go('prod')")}<h2>تعديل منتج</h2>${prodFields(p)}<button class="btn" onclick="saveP()">حفظ</button><button class="btn t dg" onclick="delP('${p.id}')">🗑 حذف المنتج</button>`}
function saveP(){const n=$('pn').value.trim(),pr=num($('pp').value);if(!n||!(pr>=0))return toast('أكمل الاسم والسعر');
  const d={name:n,cat:$('pc').value,unit:$('pu').value,price:pr,stock:num($('ps').value)||0,min:num($('pm').value)||0,ai:$('pa').value.trim()};
  if(v.pf){Object.assign(P(v.pf),d);save();toast('تم التعديل');return go('prod')}
  S.products.push({id:uid(),...d});save();toast('تم الحفظ');render()}
function delP(id){if(!confirm('حذف المنتج؟ الطلبات القديمة هتفضل زي ما هي'))return;S.products=S.products.filter(p=>p.id!==id);save();toast('تم الحذف');go('prod')}
function restock(i){const q=num(prompt('الكمية اللي وصلت:'));if(!(q>0))return;P(i).stock+=q;save();render()}

// ---------- APPROX LOCATION FROM VILLAGE NAMES ----------
let geoBusy=false;
async function geoVillage(vl,mz){const a=[vl,mz&&mz!=='بدون مركز'?'مركز '+mz:'','بني سويف','مصر'].filter(Boolean).join('، '),b=[vl,'بني سويف','مصر'].join('، '),qs=a===b?[a]:[a,b];let errs=0;
  for(let i=0;i<qs.length;i++){try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=eg&accept-language=ar&viewbox=30.3,29.5,31.7,28.2&bounded=1&q='+encodeURIComponent(qs[i]));
    if(r.ok){const j=await r.json(),h=j.find(x=>+x.lat>=28.2&&+x.lat<=29.5&&+x.lon>=30.3&&+x.lon<=31.7);if(h)return{lat:+(+h.lat).toFixed(5),lng:+(+h.lon).toFixed(5),n:h.display_name}}else errs++}catch(_){errs++}
    await new Promise(r=>setTimeout(r,1100))}
  return errs===qs.length?undefined:null}
async function approxAll(silent,keep,only){if(geoBusy)return null;const todo={};
  S.customers.forEach(c=>{if(c.lat==null&&c.village&&(!only||only.has(c.id))){const k=nk(c.mz||'')+'|'+nk(c.village);(todo[k]=todo[k]||{mz:c.mz||'',vl:c.village,cs:[]}).cs.push(c)}});
  const keys=Object.keys(todo);if(!keys.length){if(!silent)toast('مفيش عملاء من غير موقع وليهم قرية');return{ok:0,bad:[],fail:0}}
  if(!silent&&!confirm('هدوّر على '+keys.length+' قرية بالإنترنت، هياخد حوالي '+Math.ceil(keys.length*1.2)+' ثانية. تكمّل؟'))return null;
  geoBusy=true;S.vc=S.vc||{};let ok=0,fail=0;const bad=[];
  try{for(let i=0;i<keys.length;i++){const k=keys[i],t=todo[k];toast('بدوّر '+(i+1)+' من '+keys.length+': '+t.vl);
    let r=S.vc[k];if(r&&r.miss&&Date.now()-r.miss<6048e5)r=null;else if(!r||r.miss){r=await geoVillage(t.vl,t.mz);if(r!==undefined){S.vc[k]=r||{miss:Date.now()};save()}await new Promise(x=>setTimeout(x,1100))}
    if(r){t.cs.forEach(c=>{if(c.lat==null){c.lat=r.lat;c.lng=r.lng;c.approx=1;c.acc=0;if(silent&&!keep)c.init=1;ok++}})}else if(r===undefined)fail++;else bad.push(t.vl+(t.mz?' ('+t.mz+')':''))}}
  finally{geoBusy=false;save();render()}
  if(!silent){toast('اتحدد موقع تقريبي لـ '+ok+' عميل'+(fail?' (فشل الاتصال في '+fail+' قرية، جرّب تاني)':''));
    if(bad.length)alert('مالقيتش مكان لـ '+bad.length+' قرية:\n'+bad.join('\n')+'\n\nسجّل موقع عملاء القرى دي بإيدك من صفحة العميل.')}
  return{ok,bad,fail}}
function clearApprox(){if(!confirm('تمسح كل المواقع التقريبية؟ المواقع الدقيقة مش هتتأثر.'))return;S.customers.forEach(c=>{if(c.approx){c.lat=null;c.lng=null;c.approx=0}});save();toast('اتمسحت');render()}
const gll=x=>{const c=x.cs.find(c=>c.lat!=null);if(c)return{lat:c.lat,lng:c.lng};const r=S.vc&&S.vc[nk(x.mz==='بدون مركز'?'':x.mz)+'|'+nk(x.vl)];return r&&r.lat!=null?r:null};
async function villageLL(vl,mz){const k=nk(mz&&mz!=='بدون مركز'?mz:'')+'|'+nk(vl);S.vc=S.vc||{};let r=S.vc[k];
  if(r&&r.lat!=null)return r;if(r&&r.miss&&Date.now()-r.miss<6048e5)return null;
  r=await geoVillage(vl,mz);S.vc[k]=r||{miss:Date.now()};save();await new Promise(x=>setTimeout(x,1100));return r}
async function fillApprox(id){const c=C(id);if(!c||c.lat!=null||!c.village)return;toast('بدوّر على موقع '+c.village+'...');
  const r=await villageLL(c.village,c.mz),c2=C(id);if(!c2||c2.lat!=null)return;
  if(r){c2.lat=r.lat;c2.lng=r.lng;c2.approx=1;c2.acc=0;save();toast('اتحدد موقع '+c2.village+' تقريبيًا');if(v.cid===id||(v.tab==='cust'&&!v.cedit&&!v.addc&&!v.imp&&!v.order))render()}
  else toast('مالقيتش '+c2.village+' على الخريطة. سجّل موقعه بإيدك من صفحة العميل')}
function tourHref(g){let st=g.slice(0,10).map(x=>{const c=gll(x);return c?{ll:c.lat+','+c.lng,lat:c.lat,lng:c.lng}:{ll:[x.vl,x.mz==='بدون مركز'?'':x.mz,'بني سويف مصر'].filter(Boolean).join(' ')}});
  if(st.length>2&&st.every(s=>s.lat!==undefined)){const H=homeLL(),r=[];let cur=H;if(!cur){cur=st.shift();r.push(cur)}while(st.length){let bi=0,bd=1e9;st.forEach((s,i)=>{const d=hav(cur,s);if(d<bd){bd=d;bi=i}});cur=st.splice(bi,1)[0];r.push(cur)}st=r}
  const dest=st[st.length-1],w=st.slice(0,-1).map(s=>s.ll).join('|');
  return 'https://www.google.com/maps/dir/?api=1&travelmode=driving'+originQ()+'&destination='+encodeURIComponent(dest.ll)+(w?'&waypoints='+encodeURIComponent(w):'')}

const homeLL=()=>S.home&&S.home.lat!=null?{lat:S.home.lat,lng:S.home.lng}:null;
const originQ=()=>S.home?'&origin='+encodeURIComponent(S.home.lat!=null?S.home.lat+','+S.home.lng:[S.home.n,S.home.mz?'مركز '+S.home.mz:'','بني سويف','مصر'].filter(Boolean).join('، ')):'';
async function homeGeo(){const h=S.home;if(!h||h.lat!=null||navigator.onLine===false||(h.miss&&Date.now()-h.miss<6048e5))return;const r=await geoVillage(h.n,h.mz);if(r){h.lat=r.lat;h.lng=r.lng;delete h.miss}else h.miss=Date.now();save()}
async function setHome(){const n=(prompt('اسم القرية اللي بتنطلق منها دايمًا:',S.home.n)||'').trim();if(!n)return;const g=Object.entries(GZ).find(([z,l])=>l.some(x=>nk(x)===nk(n)));S.home={n,mz:g?g[0]:''};save();render();await homeGeo();render()}
let initBusy=false;
async function initOld(){if(initBusy||S.initDone||!unl||!S.customers.length)return;initBusy=true;
  try{if(!S.initV){const t=Date.now(),need=S.customers.filter(c=>!c.pend&&!S.visits.some(x=>x.cid===c.id)&&!S.orders.some(o=>!o.cx&&o.cid===c.id));
      need.forEach(c=>S.visits.push({id:uid(),cid:c.id,t,auto:5}));S.initV=1;S.initNote={v:need.length,l:0,bad:[]};save();render()}
    if(S.customers.some(c=>c.lat==null&&c.village)){if(navigator.onLine===false)return;const r=await approxAll(true);
      if(r){S.initNote=S.initNote||{v:0,l:0,bad:[]};S.initNote.l=(S.initNote.l||0)+r.ok;S.initNote.bad=r.bad;if(!r.fail)S.initDone=1}}
    else S.initDone=1;
    save();render()}finally{initBusy=false}}
function undoInit(){if(!confirm('تلغي التجهيز الأولي؟ هتتمسح الزيارات الأولية والمواقع التقريبية اللي اتحطت للعملاء القدام.'))return;
  S.visits=S.visits.filter(x=>x.auto!==5);S.customers.forEach(c=>{if(c.init&&c.approx){c.lat=null;c.lng=null;c.approx=0}c.init=0});S.initNote=null;S.initDone=1;S.initV=1;save();toast('اتلغى التجهيز الأولي');render()}
async function setupOld(){const need=S.customers.filter(c=>!S.visits.some(x=>x.cid===c.id)&&!S.orders.some(o=>!o.cx&&o.cid===c.id));
  if(need.length){const n=num(prompt('الزيارة دي حصلت من كام يوم؟ (اكتب 0 لو النهارده). هتتسجل لـ '+need.length+' عميل، ومش بتتحسب في زيارات اليوم.','7'));if(!(n>=0))return;
    const t=Date.now()-n*864e5;need.forEach(c=>S.visits.push({id:uid(),cid:c.id,t,auto:5}));save();toast('اتسجلت زيارة لـ '+need.length+' عميل');render()}
  if(S.customers.some(c=>c.lat==null&&c.village))await approxAll()}

// ---------- VISITS BY LOCATION + VILLAGE LOOKUP ----------
const VV=1.5,VR=150,isEx=c=>c.lat!=null&&!c.approx;let lookupRes=null;
function gpsNow(){return new Promise((ok,no)=>{if(!navigator.geolocation)return no({code:0});navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy||0}),no,{enableHighAccuracy:true,timeout:20000,maximumAge:30000})})}
function ctr(x){const ex=x.cs.filter(c=>c.lat!=null&&!c.approx);if(ex.length)return{lat:ex.reduce((a,c)=>a+c.lat,0)/ex.length,lng:ex.reduce((a,c)=>a+c.lng,0)/ex.length};return gll(x)}
async function whereAmI(silent){let p;try{p=await gpsNow()}catch(err){if(!silent)toast(err&&err.code===1?'الإذن مرفوض. فعّل الموقع للمتصفح من إعدادات الآيفون':'مقدرتش أحدد موقعك. تأكد إن الـ GPS شغال');return}
  if(p.acc>150){if(!silent)toast('دقة الموقع ضعيفة (حوالي '+Math.round(p.acc)+' متر). جرّب برا المبنى');return}
  const names=[];S.customers.forEach(c=>{if(c.lat!=null&&!c.approx&&hav(p,c)*1000<=VR+Math.min(p.acc,50)&&autoVisit(c.id,2))names.push(c.name)});
  const vs=[];groups().forEach(x=>{if(!x.cs.length||x.last>=day0())return;const c=ctr(x);if(c&&hav(p,c)<=VV){S.pv.push({id:uid(),mz:x.mz,vl:x.vl,t:Date.now(),auto:1});vs.push(gname(x))}});
  if(names.length||vs.length){save();toast('اتسجلت زيارة: '+[...names,...vs.map(n=>'قرية '+n)].join('، '));render()}
  else if(!silent){pickFix=p;v={tab:'cov',pick:1};render()}}
function autoCheck(){if(!S.auto||!unl||Date.now()-(S.lastAuto||0)<12e5)return;S.lastAuto=Date.now();save();whereAmI(true)}
function toggleAuto(){S.auto=!S.auto;save();render();if(S.auto)whereAmI()}
function visitsHTML(cid){const vs=S.visits.filter(x=>x.cid===cid).sort((a,b)=>b.t-a.t);
  return '<h2>الزيارات</h2>'+(vs.length?`<p class="mu" style="margin-top:-8px">${vs.length} زيارة • آخر زيارة ${dt(vs[0].t)}</p>`+vs.slice(0,5).map(x=>`<div class="card stat" style="font-size:16px"><span>${dt(x.t)} <span class="mu">${x.auto===5?'• تسجيل أولي':x.auto===2?'• بالموقع':x.auto?'• تلقائي':''}</span></span><button class="qb" onclick="delVisit('${x.id}')">✖</button></div>`).join(''):'<p class="mu">لسه مفيش زيارات مسجلة</p>')}
function delVisit(id){if(!confirm('تحذف الزيارة دي؟'))return;S.visits=S.visits.filter(x=>x.id!==id);save();render()}
async function lookupVillage(){const vl=($('lv').value||'').trim(),mz=$('lm').value;if(!vl)return toast('اكتب اسم القرية');
  toast('بدوّر على '+vl+'...');const r=await geoVillage(vl,mz);if(!r)return toast('مالقيتش القرية دي على الخريطة. جرّب كتابة تانية أو اختار المركز');
  S.vc=S.vc||{};S.vc[nk(mz||'')+'|'+nk(vl)]=r;
  let n=0;
  S.customers.forEach(c=>{if(c.lat==null&&c.village&&nk(c.village)===nk(vl)&&(!mz||!c.mz||nk(c.mz)===nk(mz))){c.lat=r.lat;c.lng=r.lng;c.approx=1;c.acc=0;if(!c.mz&&mz)c.mz=mz;n++}});
  const inG=Object.entries(GZ).some(([z,l])=>(!mz||z===mz)&&l.some(q=>nk(q)===nk(vl))),inC=S.customers.some(c=>nk(c.village||'')===nk(vl));
  if(!inG&&!inC&&!S.places.some(p=>nk(p.vl)===nk(vl)&&(!mz||p.mz===mz)))S.places.push({id:uid(),mz:mz||'بدون مركز',vl});
  save();lookupRes={vl,mz,n,r};render()}

let pickFix=null;
async function visitHere(id,fix){const c=C(id);if(!c)return;let p=fix;
  if(!p){toast('بحدد موقعك...');try{p=await gpsNow()}catch(err){const a=autoVisit(id,0);save();toast((a?'اتسجلت الزيارة':'الزيارة متسجلة النهارده')+'، بس مقدرتش أحدد الموقع'+(err&&err.code===1?' (الإذن مرفوض)':''));return render()}}
  let saved=false,note='';
  if(p.acc>150)note='، بس دقة الموقع ضعيفة فمحفظتش الموقع';
  else{const had=c.lat!=null&&!c.approx,far=had?hav(p,c)*1000:0;
    if(!had||(far>300&&confirm('موقعك بعيد حوالي '+Math.round(far)+' متر عن الموقع المسجل للعميل. تحدّث موقعه؟'))){c.lat=+p.lat.toFixed(6);c.lng=+p.lng.toFixed(6);c.acc=Math.round(p.acc);c.approx=0;saved=true}}
  const a=autoVisit(id,saved?2:0);if(S.trkOn)trkAdd(p,Date.now(),1);save();toast((a?'اتسجلت الزيارة':'الزيارة متسجلة النهارده')+(saved?' + موقع العميل':'')+note);render()}
function pickRows(q){q=nrm(q||'');const p=pickFix;
  const d=c=>c.lat!=null&&p?hav(p,c):1e9,ex=c=>c.lat!=null&&!c.approx;
  const l=S.customers.filter(c=>!q||nrm([c.name,c.village,c.mz,c.shop].join(' ')).includes(q)).sort((a,b)=>ex(a)-ex(b)||d(a)-d(b)||a.name.localeCompare(b.name,'ar')).slice(0,60);
  return l.length?l.map(c=>`<button class="item" onclick="pickDo('${c.id}')"><span><b>${e(c.name)}</b><br><span class="mu">${e([c.village,c.mz].filter(Boolean).join(' - '))}${ex(c)?' • موقعه دقيق':c.lat!=null?' • موقع تقريبي':' • من غير موقع'}</span></span><span style="font-size:26px">✅</span></button>`).join(''):'<p class="mu">مفيش عملاء بالاسم ده</p>'}
function fpk(q){$('pklist').innerHTML=pickRows(q)}
function pickView(){return `${back("v={tab:'cov'};render()")}<h2>انت عند مين؟</h2><p class="mu" style="margin-top:-8px">موقعك اتحدد${pickFix?' (دقة حوالي '+Math.round(pickFix.acc)+' متر)':''}. اختار العميل اللي انت عنده، ويتسجل له الزيارة والموقع مع بعض. اللي من غير موقع أو أقرب ليك بيظهر الأول.</p><input placeholder="🔍 ابحث بالاسم أو القرية" oninput="fpk(this.value)"><div id="pklist">${pickRows('')}</div>`}
async function pickDo(id){const p=pickFix;v={tab:'cov'};await visitHere(id,p)}

let mt='all',mv='',mtxt='',mq=null;
const TPL={offer:'السلام عليكم يا {الاسم}، عندنا عروض جديدة على الأسمدة والمبيدات الزراعية بأسعار مميزة. تحب أعدّي عليك أو أبعتلك الأسعار؟ 🌾',
 debt:'السلام عليكم يا {الاسم}، بخصوص حسابك: المتبقي {المبلغ} جنيه. ياريت تسوّيه وقت ما تقدر. شكرًا لتعاملك معانا 🌾',
 visit:'السلام عليكم يا {الاسم}، هعدّي عليك في {القرية} قريب إن شاء الله. لو محتاج أي أسمدة أو مبيدات قولي وأجيبها معايا 🌾'};
const dueDays=()=>S.due||30;
function setDue(){const n=num(prompt('مدة السداد المسموحة بالأيام:',dueDays()));if(n>0){S.due=Math.round(n);save();render()}}
function oldestUnpaid(cid){const L=S.ledger.filter(l=>l.cid===cid).sort((a,b)=>a.t-b.t);let paid=L.filter(l=>l.type==='PAID').reduce((s,l)=>s+l.amt,0);
  for(const l of L){if(l.type!=='OWES')continue;if(paid>=l.amt-0.005){paid-=l.amt;continue}return l.t}return null}
function lateList(){return S.customers.map(c=>({c,b:bal(c.id),t:oldestUnpaid(c.id)})).filter(x=>x.b>0&&x.t&&(Date.now()-x.t)/864e5>dueDays()).sort((a,b)=>a.t-b.t)}
function lateTag(cid){const t=oldestUnpaid(cid);if(!t||bal(cid)<=0)return '';const d=Math.floor((Date.now()-t)/864e5),late=d>dueDays();

const TRK_MS=24e4;let trkTimer=null,tkd=0;
function trkAdd(p,t,force){S.tp=S.tp||[];const last=S.tp[S.tp.length-1];if(!force&&last&&t-last.t<TRK_MS-1e4)return false;
  S.tp.push({t,lat:+p.lat.toFixed(5),lng:+p.lng.toFixed(5),a:Math.round(p.acc||0)});
  const cut=t-7*864e5;if(S.tp[0].t<cut)S.tp=S.tp.filter(x=>x.t>=cut);return true}

function trkSvg(pts,stops,home){const all=[...pts,...stops.map(s=>s.c),...(home?[home]:[])];if(!all.length)return '';

    sc=one?0:Math.min(dx>1e-7?(W-2*p)/dx:1e9,dy>1e-7?(H-2*p)/dy:1e9),ox=(W-dx*sc)/2,oy=(H-dy*sc)/2,pt=c=>one?[W/2,H/2]:[ox+(c.lng-x0)*k*sc,oy+(b-c.lat)*sc];

function aiLocal(q){
  const n=anorm(q);if(!n)return null;
  const has=re=>re.test(n),c=aiCands(n),amt=aiAmt(n);

  const pick=(cs,mk)=>'<div style="margin-top:6px">'+cs.slice(0,6).map(mk).join('')+(cs.length>6?'<div class="mu">فيه غيرهم، اكتب الاسم كامل</div>':'')+'</div>';

  if(has(/ساعد|تقدر|تعمل ايه|اعمل ايه|اوامر|تعرف تعمل|ايه اللي تعرفه/)&&!c.length)return AI_HELP;
  if(has(/(كام|عدد)/)&&has(/زياره|زرت/)&&has(/النهارده|اليوم/))return aiToday();
  if(has(/حصل|تحصيل|دفع|استلم|خدت فلوس|اخدت فلوس/)){

    if(c.length===1)return aiConfirm('visit',c[0],0);

  if(has(/مسار|طريق|روت|وصلني|خريطه|خط السير/))return aiRoute();
  if(has(/قرى|قريه|جوله|مزرتش|مزرتهاش|ما اتزار|مش اتزار|متزار|محتاج|متاخره|لم تزر|زور/))return aiVisits();
  if(has(/سجل|زرت|اتزار|اتزرت/))return 'سجّل زيارة لمين؟ اكتب اسم العميل.';

  if(has(/رصيد|كشف|فاضل|فاضلي/)){
    if(!c.length)return 'معرفتش العميل ده. اكتب اسمه زي ما هو في الجهات، أو القرية.';
    if(c.length===1)return aiBal(c[0]);
    return 'في أكتر من عميل بالاسم ده، اختار:'+pick(c,x=>btn(x,`aiGo('${x.id}')`))}
  if(has(/كام عليه|عليه كام|كام ليه|ليه كام|مين عليه|مين عليهم|مديون|ديون|عليهم فلوس|عليه فلوس|اكبر مدين|اكتر واحد عليه|متاخرين في/)){
    if(c.length===1)return aiBal(c[0]);
    if(c.length>1)return 'في أكتر من عميل بالاسم ده، اختار:'+pick(c,x=>btn(x,`aiGo('${x.id}')`));
    return aiDebts()}
  if(has(/مخزون|يخلص|خلص|قرب|ناقص|نفد|نفذ|متبقي/)){
    const pc=aiProdCands(n);
    if(pc.length===1)return aiProd(pc[0]);
    if(pc.length>1)return 'اخترت أي منتج؟<br>'+pc.slice(0,6).map(p=>'• '+aiProd(p)).join('<br>');
    return aiLow()}
  if(has(/ملخص|النهارده|اليوم|حصيله|نتيجه/))return aiToday();
  if(c.length===1)return aiBal(c[0]);
  if(c.length>1)return 'في أكتر من عميل بالاسم ده، اختار:'+pick(c,x=>btn(x,`aiGo('${x.id}')`));
  return null}
function aiContext(q){const d0=day0(),vis=S.visits.filter(x=>x.t>=d0).length,ord=S.orders.filter(o=>!o.cx&&o.t>=d0).length,col=S.ledger.filter(l=>l.type==='PAID'&&l.t>=d0).reduce((a,l)=>a+l.amt,0);
  const debt=S.customers.map(c=>({c,b:bal(c.id)})).filter(x=>x.b>0).sort((a,b)=>b.b-a.b).slice(0,5);
  const low=S.products.filter(p=>isLow(p)).slice(0,8);
  const need=groups().filter(x=>x.cs.length&&x.st>=2).sort((a,b)=>b.st-a.st||(b.days||0)-(a.days||0)).slice(0,6);
  const tk=aiToks(anorm(q));const hit=S.customers.filter(c=>{const h=anorm(c.name);return tk.some(t=>aiTokMatch(h,t))}).slice(0,5);
  const L=['تاريخ اليوم: '+new Date().toLocaleDateString('en-GB'),'النهارده: '+vis+' زيارة، '+ord+' طلب، تحصيل '+r2(col)+' جنيه.'];
  L.push('أكبر المديونيات: '+(debt.map(x=>x.c.name+' ('+(x.c.village||x.c.mz||'-')+') عليه '+r2(x.b)).join('؛')||'مفيش'));
  L.push('منتجات قربت تخلص: '+(low.map(p=>p.name+' متاح '+r2(p.stock)).join('؛')||'مفيش'));
  L.push('قرى محتاجة زيارة: '+(need.map(x=>gname(x)+' ('+stTxt(x)[0]+')').join('؛')||'مفيش'));
  if(hit.length)L.push('عملاء ذكروا في السؤال: '+hit.map(c=>c.name+' ('+(c.village||'-')+'، '+(c.mz||'-')+') رصيده '+r2(bal(c.id))).join('؛'));
  return 'البيانات:\n'+L.join('\n')}
async function aiCloudAnthropic(q,key){const ctx=aiContext(q);let r;

  if(!r.ok)throw new Error('الخدمة رجعت خطأ '+r.status+'، جرّب بعدين');

  const flash=names.filter(n=>/flash/i.test(n)&&!/preview|exp|image|tts|live|lite|thinking/i.test(n));
  const pref=['gemini-2.5-flash','gemini-2.0-flash','gemini-flash-latest'];

async function aiCloudGoogle(q,key){const ctx=aiContext(q);let model=aiModel();

      try{r=await send(gen(model))}catch(_){throw new Error('مفيش اتصال بالإنترنت، جرّب بعدين')}}}
  if(!r.ok&&aq&&(r.status===400||r.status===403||r.status===404)){try{const r2=await send(vert(model));if(r2.ok)r=r2}catch(_){}}
  if(r.status===400||r.status===401)throw new Error('المفتاح غلط أو شكله مش مقبول (كود '+r.status+'). جرّب مفتاح جديد من Google AI Studio');

  if(r.status===404)throw new Error('الموديل ('+model+') مش متاح للمفتاح ده (كود 404). جرّب مفتاح تاني من Google AI Studio، أو اكتب اسم موديل تاني في الإعدادات');

  ${nz.length?`<details class="card" open><summary style="min-height:44px;font-weight:700">🧩 عملاء من غير مركز (${nz.length})</summary>${nz.map(c=>{const cs=c.village?cands(c.village).slice(0,3):[];return `<div style="margin:12px 0"><b>${e(c.name)}</b> <span class="mu">${c.village?'• قريته المكتوبة: '+e(c.village):'• من غير قرية مكتوبة'}</span>${cs.map(h=>`<button class="btn t sm" style="margin-top:6px" onclick="setVillage('${c.id}','${h.z}','${h.n}')">← ${e(h.n)} (${h.z})</button>`).join('')}<button class="btn t sm" style="margin-top:6px" onclick="v={tab:'cust',cedit:'${c.id}'};render()">✏️ تعديل القرية والمركز</button></div>`}).join('')}</details>`:''}
  <details class="card"><summary style="min-height:44px;font-weight:700">📍 عملاء من غير موقع دقيق (${nol.length})</summary>${nol.map(c=>`<div class="stat" style="font-size:17px;margin:8px 0"><span>${e(c.name)}<br><span class="mu">${e([c.village,c.mz].filter(Boolean).join(' - '))}${c.approx?' • تقريبي':''}</span></span><button class="btn t sm" style="flex:none;width:auto;padding:8px 14px" onclick="open_('${c.id}')">📍 سجّل</button></div>`).join('')||'<p class="mu">كلهم ليهم موقع ✅</p>'}</details>`}

// ---------- IMPORT CONTACTS ----------
let pend=[];
const nrm=s=>(s||'').replace(/[إأآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();
const ph10=p=>(p||'').replace(/\D/g,'').slice(-10);
const qp=s=>{try{return decodeURIComponent(s.replace(/=([0-9A-F]{2})/gi,'%$1'))}catch(_){return s}};
function splitName(n){n=(n||'').replace(/\s+/g,' ').trim();let nm=n,pl='';
  const m=n.match(/^(.+?)\s*[-–—،,\/|]\s*([^-–—،,\/|]+)$/);
  if(m){nm=m[1].trim();pl=m[2].trim()}
  else{const z=MZ.find(z=>nrm(n).endsWith(' '+nrm(z)));if(z){nm=n.slice(0,n.length-z.length).trim();pl=z}}
  const mz=MZ.find(z=>nrm(pl)===nrm(z)||nrm(pl)===nrm('مركز '+z)||nrm(pl)===nrm('م '+z))||'';
  return{name:nm,mz,village:mz?'':pl}}
function parseVcf(t){t=t.replace(/=\r?\n/g,'').replace(/\r?\n[ \t]/g,'');const out=[];
  t.split(/BEGIN:VCARD/i).slice(1).forEach(b=>{let fn='',tel='',org='',xm='',xv='',nt='',pd0='';
    b.split(/\r?\n/).forEach(l=>{const i=l.indexOf(':');if(i<0)return;const k=l.slice(0,i).toUpperCase(),val=l.slice(i+1),d=/QUOTED-PRINTABLE/.test(k)?qp(val):val;
      if(/^FN(;|$)/.test(k)&&!fn)fn=d.trim();else if(/^TEL/.test(k)&&!tel)tel=d.trim();else if(/^ORG(;|$)/.test(k)&&!org)org=d.replace(/;/g,' ').trim();else if(k==='X-MARKAZ')xm=d.trim();else if(k==='X-VILLAGE')xv=d.trim();else if(/^NOTE(;|$)/.test(k)&&!nt)nt=d.trim();else if(k==='X-PENDING')pd0=d.trim()});
    if(fn||tel)out.push({name:fn,phone:tel,shop:org,mz:xm,village:xv,note:nt,pend:pd0?1:0})});return out}
function setPend(l){const have=new Set(S.customers.map(c=>ph10(c.phone)).filter(Boolean)),seen=new Set();
  pend=l.filter(x=>x.name||x.phone).map(x=>{const s=(x.mz||x.village)?{name:x.name,mz:x.mz||'',village:x.village||''}:splitName(x.name||x.phone),p=(x.phone||'').replace(/[^\d+]/g,''),k=ph10(p),dup=!!k&&(have.has(k)||seen.has(k));if(k)seen.add(k);return{...s,shop:x.shop||'',note:x.note||'',pend:x.pend?1:0,phone:p,dup,on:!dup}});
  render()}
async function pick(){try{const r=await navigator.contacts.select(['name','tel'],{multiple:true});setPend(r.map(c=>({name:(c.name||[])[0]||'',phone:(c.tel||[])[0]||''})))}catch(_){toast('تعذر فتح جهات الاتصال')}}
function loadVcf(f){if(!f)return;const r=new FileReader();r.onload=()=>{const l=parseVcf(String(r.result));l.length?setPend(l):toast('مفيش جهات اتصال في الملف')};r.readAsText(f,'utf-8')}
function doImp(){const l=pend.filter(x=>x.on);if(!l.length)return toast('اختار عميل واحد على الأقل');
  const ids=new Set();l.forEach(x=>{const id=uid();if(x.pend)ids.add(id);S.customers.push({id,name:x.name,phone:x.phone,shop:x.shop||'',mz:x.mz,village:x.village,note:x.note||'',pend:x.pend?1:0,lat:null,lng:null,link:''})});
  fixPlaces();save();pend=[];toast('تم استيراد '+l.length+' عميل');go('cust');if(ids.size)approxAll(true,true,ids)}
function impView(){const cp=!!(navigator.contacts&&navigator.contacts.select);
  if(!pend.length)return `<button class="btn t" onclick="go('cust')">→ رجوع</button><h2>استيراد العملاء</h2>
  <p class="mu">الاسم والقرية أو المركز بيتفصلوا تلقائيًا لو بينهم شرطة (-) أو فاصلة، أو لو الاسم بينتهي باسم مركز. هتشوف المعاينة قبل الحفظ.</p>
  ${cp?'<button class="btn" onclick="pick()">📱 اختار من جهات الاتصال</button>':''}
  <label class="btn${cp?' t':''}" style="cursor:pointer">📄 اختار ملف جهات الاتصال (.vcf)<input type="file" accept=".vcf,text/vcard,text/x-vcard,text/plain" onchange="loadVcf(this.files[0])" style="display:none"></label>`;
  return `<button class="btn t" onclick="pend=[];render()">→ رجوع</button><h2>معاينة الاستيراد</h2>
  <p><b>${pend.length}</b> جهة اتصال • المحدد <b id="impn">${pend.filter(x=>x.on).length}</b></p>
  <button class="btn" onclick="doImp()">✔ استيراد المحدد</button>
  ${pend.map((x,i)=>`<label class="item" style="cursor:pointer"><span><b>${e(x.name)}</b><br><span class="mu">${e(x.phone)}${x.shop?' • '+e(x.shop):''}${x.mz||x.village?' • '+e([x.village,x.mz].filter(Boolean).join(' - ')):''}${x.dup?' • موجود قبل كده':''}</span></span><input type="checkbox" style="width:28px;min-height:28px;margin:0" ${x.on?'checked':''} onchange="pend[${i}].on=this.checked;$('impn').textContent=pend.filter(y=>y.on).length"></label>`).join('')}`}

// ---------- MAP ----------
const hav=(a,b)=>{const r=x=>x*Math.PI/180,h=Math.sin(r(b.lat-a.lat)/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(r(b.lng-a.lng)/2)**2;return 12742*Math.asin(Math.sqrt(h))};
let rad=2,mk='';const MC=['#2e7d32','#1565c0','#ef6c00','#8e24aa','#c62828','#00838f','#6d4c41','#455a64'],mcol=c=>c.mz&&MZ.includes(c.mz)?MC[MZ.indexOf(c.mz)]:'#888';
function parseLL(s){s=(s||'').trim();const m=s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||s.match(/[?&](?:q|ll|query|destination)=(-?\d+\.\d+)(?:,|%2C)(-?\d+\.\d+)/i)||s.match(/^(-?\d+\.\d+)\s*[,،]\s*(-?\d+\.\d+)$/);return m?{lat:+m[1],lng:+m[2]}:null}
function setLoc(id){const t=(prompt('الصق إحداثيات المكان أو رابط طويل من الخرائط (مثال: 28.9101, 31.0902)')||'').trim();if(!t)return;const c=C(id),ll=parseLL(t);if(!ll)return toast('مش لاقي إحداثيات في النص ده');c.lat=ll.lat;c.lng=ll.lng;c.approx=0;if(/^https?:/i.test(t))c.link=t;save();toast('تم حفظ الموقع');render()}
const wp=c=>c.lat!=null?c.lat+','+c.lng:[c.shop||c.name,c.village,c.mz,'بني سويف'].filter(Boolean).join(' ');
function routeHref(l){l=l.slice(0,10);const w=l.slice(0,-1).map(wp).join('|');return 'https://www.google.com/maps/dir/?api=1&travelmode=driving'+originQ()+'&destination='+encodeURIComponent(wp(l[l.length-1]))+(w?'&waypoints='+encodeURIComponent(w):'')}
function plot(l){
 if(!l.length)return '<div class="card mu">لسه مفيش عملاء ليهم إحداثيات. افتح عميل واضغط "إضافة إحداثيات الموقع".</div>';
 const grp=Object.values(l.reduce((m,c)=>{const k=c.lat.toFixed(4)+','+c.lng.toFixed(4);(m[k]=m[k]||[]).push(c);return m},{}));
 const W=340,H=300,p=28,la=l.map(c=>c.lat),ln=l.map(c=>c.lng),a=Math.min(...la),b=Math.max(...la),x0=Math.min(...ln),x1=Math.max(...ln),k=Math.cos((a+b)/2*Math.PI/180),dx=(x1-x0)*k,dy=b-a,one=dx<1e-7&&dy<1e-7,sc=one?0:Math.min(dx>1e-7?(W-2*p)/dx:1e9,dy>1e-7?(H-2*p)/dy:1e9),ox=(W-dx*sc)/2,oy=(H-dy*sc)/2;
 const pt=c=>one?[W/2,H/2]:[ox+(c.lng-x0)*k*sc,oy+(b-c.lat)*sc];
 return `<div class="card"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:var(--bg);border-radius:10px"><text x="${W-6}" y="16" font-size="12" fill="var(--mu)" text-anchor="end">⬆ شمال</text>${grp.map(gc=>{const c=gc[0],[x,y]=pt(c);return `<g onclick="${c.vlg?"go('cov')":`open_('${c.id}')`}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${c.vlg?8:10}" fill="${c.vlg?'none':mcol(c)}" opacity="${gc.every(z=>z.approx)?.55:1}" stroke="${c.vlg?mcol(c):'var(--card)'}" stroke-width="${c.vlg?3:2}"${c.vlg?' stroke-dasharray="3 2"':''}/><text x="${x}" y="${y+24}" font-size="12" text-anchor="middle" fill="var(--tx)">${e(c.name.split(' ')[0])}${gc.length>1?' +'+(gc.length-1):''}</text></g>`}).join('')}</svg><div class="mu" style="line-height:2">${[...new Set(l.map(c=>c.mz||'بدون مركز'))].map(m=>`<span style="white-space:nowrap"><span style="color:${MZ.includes(m)?MC[MZ.indexOf(m)]:'#888'}">●</span> ${e(m)}</span>`).join(' &nbsp; ')}<br>الرسم تقريبي من غير خلفية خرائط، والنقطة الباهتة موقع تقريبي على مستوى القرية، والدايرة المفرغة قرية من غير عملاء. دوس على أي نقطة عميل تفتح صفحته</div></div>`}
function near(l){const left=[...l],out=[];while(left.length){const s=left.shift(),g=[s];for(let i=left.length-1;i>=0;i--)if(hav(s,left[i])<=rad){g.push(left[i]);left.splice(i,1)}out.push(g)}return out.filter(x=>x.length>1)}
function rowC(c){return `<div class="mu" style="cursor:pointer;padding:6px 0" onclick="open_('${c.id}')">• <b style="color:var(--tx)">${e(c.name)}</b>${c.village?' - '+e(c.village):''} ${balHTML(bal(c.id))}</div>`}
function mapView(){
 const all=mk?S.customers.filter(c=>c.mz===mk):S.customers,w=all.filter(c=>c.lat!=null),g={},vp=groups().filter(x=>!x.cs.length&&(!mk||x.mz===mk)).map(x=>{const q=gll(x);return q&&{id:'',name:x.vl,mz:x.mz==='بدون مركز'?'':x.mz,lat:q.lat,lng:q.lng,approx:1,vlg:1}}).filter(Boolean);
 all.forEach(c=>{const k=c.mz||'بدون مركز';(g[k]=g[k]||[]).push(c)});
 const cl=near(w);
 return `<h2>العملاء على الخريطة</h2><select onchange="mk=this.value;render()"><option value="">كل المراكز</option>${MZ.map(m=>`<option${m===mk?' selected':''}>${m}</option>`).join('')}</select>${plot(w.concat(vp))}${all.length>w.length?`<p class="mu">${all.length-w.length} عميل من غير إحداثيات مش ظاهرين في الرسم</p>`:''}
 <h2>عملاء جمب بعض</h2><select onchange="rad=+this.value;render()">${[1,2,5,10].map(r=>`<option value="${r}"${r===rad?' selected':''}>في حدود ${r} كم</option>`).join('')}</select>
 ${cl.map(x=>`<div class="card"><b>${x.length} عملاء قريبين</b>${x.map(rowC).join('')}<a class="btn t" target="_blank" rel="noopener" style="margin:8px 0 0" href="${e(routeHref(x))}">🧭 مسار لكلهم (أول 10)</a></div>`).join('')||'<p class="mu">مفيش عملاء قريبين في النطاق ده، أو لسه مضفتش إحداثيات.</p>'}
 <h2>حسب المركز</h2>${Object.entries(g).sort((a,b)=>b[1].length-a[1].length).map(([k,x])=>`<div class="card"><b>${e(k)}</b> <span class="mu">(${x.length})</span>${x.map(rowC).join('')}<a class="btn t" target="_blank" rel="noopener" style="margin:8px 0 0" href="${e(routeHref(x))}">🧭 مسار لعملاء ${e(k)} (أول 10)</a></div>`).join('')||'<p class="mu">ضيف عملاء الأول.</p>'}`}

try{if(document.addEventListener)document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){autoCheck();trkSample()}});autoCheck()}catch(_){}
try{if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(_){}
</script>
