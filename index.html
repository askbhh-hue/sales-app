<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b5e20">
<title>مندوب المبيعات المحترف - بني سويف</title>
<style>
:root{
  --bg: #f4f7f4; --card: #ffffff; --tx: #101c14; --mu: #607264; 
  --pr: #1b5e20; --pr-light: #e8f5e9; --prt: #ffffff; --bd: #d0ded1; 
  --red: #d32f2f; --grn: #2e7d32; --ora: #f57c00; --shd: 0 4px 20px rgba(0,0,0,0.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg: #0c120e; --card: #152017; --tx: #ecf3ed; --mu: #98a89b; 
    --pr: #4caf50; --pr-light: #1b301e; --prt: #081009; --bd: #233526; 
    --red: #ef5350; --grn: #81c784; --ora: #ffb74d; --shd: 0 4px 20px rgba(0,0,0,0.3);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 system-ui,Tahoma,sans-serif;padding-bottom:96px;-webkit-tap-highlight-color:transparent;}
main{max-width:640px;margin:0 auto;padding:16px}
h2{margin:8px 0 16px;font-size:22px;font-weight:700;color:var(--tx)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:var(--shd)}
.row{display:flex;gap:12px;align-items:center}.row>*{flex:1}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border:0;border-radius:16px;background:var(--pr);color:var(--prt);font-family:inherit;font-size:17px;font-weight:600;margin-bottom:12px;cursor:pointer;text-align:center;text-decoration:none;padding:12px 18px;box-shadow:0 4px 12px rgba(27,94,32,0.2)}
.btn.t{background:var(--card);color:var(--pr);border:2px solid var(--pr);box-shadow:none}
.btn.sm{min-height:42px;font-size:14px;margin:0;padding:6px 12px;border-radius:12px}
.btn.dg{border-color:var(--red);color:var(--red);background:var(--card)}
input,select,textarea{width:100%;min-height:52px;font:inherit;padding:12px 16px;border:1.5px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);margin-bottom:12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pr)}
.stat{display:flex;justify-content:space-between;align-items:center;font-size:17px}.stat b{font-size:24px;font-weight:700}
.mu{color:var(--mu);font-size:14px}.red{color:var(--red)}.grn{color:var(--grn)}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:right;font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin-bottom:10px;min-height:64px;cursor:pointer;box-shadow:var(--shd)}
.big{font-size:36px;font-weight:800;text-align:center;color:var(--pr)}
.qb{flex:none!important;width:44px;height:44px;border-radius:50%;border:2px solid var(--pr);background:none;color:var(--pr);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 20px rgba(0,0,0,0.06);z-index:99}
nav button{flex:1;min-height:70px;border:0;background:none;color:var(--mu);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button.on{color:var(--pr)}nav i{font-style:normal;font-size:22px}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 24px;border-radius:14px;display:none;z-index:999;font-size:15px;text-align:center}
pre{white-space:pre-wrap;font:inherit;margin:0}
@media print{nav,.btn,#toast{display:none!important}body{padding:0}}
</style>
</head>
<body>
<main id="main"></main>
<nav>
  <button id="n-cov" onclick="go('cov')"><i>📍</i>الزيارات</button>
  <button id="n-cust" onclick="go('cust')"><i>👥</i>العملاء</button>
  <button id="n-today" onclick="go('today')"><i>📊</i>اليوم</button>
  <button id="n-msg" onclick="go('msg')"><i>💬</i>الرسائل</button>
  <button id="n-prod" onclick="go('prod')"><i>📦</i>المنتجات</button>
</nav>
<div id="toast"></div>

<script>
const K='fs_pro_v1',CATS=['أسمدة','مبيدات','تقاوي','منظمات نمو','أخرى'],UNITS=['شيكارة','زجاجة','لتر','كيلو','علبة'],MZ=['بني سويف','ناصر','إهناسيا','ببا','الفشن','سمسطا','الواسطى','الفيوم'];
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(_){}
function fix(){
  S=S||{};
  ['products','customers','orders','ledger','visits'].forEach(k=>S[k]=S[k]||[]);
  S.pin=S.pin||''; S.lb=S.lb||0; S.home=S.home||{n:'أطواب',mz:'الواسطى',lat:29.35,lng:31.21};
  if(!S.customers.length){
    S.customers.push({id:'c1',name:'محمود عبد الله',phone:'01012345678',shop:'محطة التوحيد',mz:'الواسطى',village:'أطواب',crop:'قمح',lat:29.351,lng:31.211});
    S.customers.push({id:'c2',name:'إبراهيم حسن',phone:'01123456789',shop:'مزرعة النور',mz:'ناصر',village:'أشمنت',crop:'برسيم',lat:29.215,lng:31.085});
  }
  if(!S.products.length){
    S.products.push({id:'p1',name:'يوريا 46.5%',cat:'أسمدة',unit:'شيكارة',price:650,stock:50,min:10});
    S.products.push({id:'p2',name:'مبيد حشري عام',cat:'مبيدات',unit:'لتر',price:180,stock:25,min:5});
  }
}
fix();
let v={tab:'today'},cart={},rp='w',unl=!S.pin,cq='';
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(_){toast('تعذر الحفظ')}};
let uidc=0;const uid=()=>Date.now().toString(36)+(uidc++).toString(36)+Math.random().toString(36).slice(2,6);
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M=n=>(Math.round(n*100)/100).toLocaleString('en-US')+' ج';
const num=s=>parseFloat(String(s??'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace('٫','.').replace(',','.'));
const $=i=>document.getElementById(i);
const P=i=>S.products.find(p=>p.id===i),C=i=>S.customers.find(c=>c.id===i);
const bal=c=>S.ledger.filter(l=>l.cid===c).reduce((s,l)=>s+(l.type==='OWES'?l.amt:-l.amt),0);
const day0=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
const dt=t=>new Date(t).toLocaleDateString('en-GB');
const r2=n=>Math.round(n*100)/100;
const isLow=p=>p.min>0?p.stock<=p.min:p.stock<=0;
function waNum(p){let d=String(p||'').replace(/[٠-٩]/g,x=>'٠١٢٣٤٥٦٧٨٩'.indexOf(x)).replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0'))d='20'+d.slice(1);return d}
const wa=(p,t)=>'https://wa.me/'+waNum(p)+'?text='+encodeURIComponent(t);
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}
function go(t){v={tab:t};cart={};cq='';render()}
function open_(c){v={tab:'cust',cid:c};render()}
function balHTML(b){return b>0?`<span class="red">عليه ${M(b)}</span>`:b<0?`<span class="grn">ليه ${M(-b)}</span>`:'<span class="mu">صفر</span>'}
const back=(f,l)=>`<button class="btn t" onclick="${f}">← ${l||'رجوع'}</button>`;

function render(){
  ['today','cust','cov','msg','prod'].forEach(t=>$('n-'+t)?.classList.toggle('on',v.tab===t));
  let h;
  if(!unl)h=`<h2>🔒 مندوب المبيعات المحترف</h2><input id="pin" type="password" inputmode="numeric" placeholder="الرقم السري" onkeydown="if(event.key==='Enter')unlock()"><button class="btn" onclick="unlock()">دخول</button>`;
  else if(v.pg==='debts')h=debtsView();
  else if(v.pg==='rep')h=repView();
  else if(v.pg==='ai')h=aiAssistantView();
  else if(v.pg==='set')h=setView();
  else if(v.stmt)h=stmtView();
  else if(v.inv)h=invView();
  else if(v.cedit||v.addc)h=custForm(v.cedit?C(v.cedit):null);
  else if(v.cid)h=custView();
  else if(v.order)h=orderView();
  else h=v.tab==='cust'?custList():v.tab==='cov'?covView():v.tab==='msg'?msgHubView():v.tab==='prod'?prodView():todayView();
  $('main').innerHTML=h;window.scrollTo(0,0);
}

function unlock(){if(hp($('pin').value)===S.pin){unl=true;render()}else toast('الرقم السري غير صحيح')}
function hp(s){let h=5381;for(const c of String(s))h=(h*33+c.charCodeAt(0))>>>0;return String(h)}

function summary(){const s=day0(),e2=s+864e5,inr=t=>t>=s&&t<e2;
  return{v:S.visits.filter(x=>inr(x.t)&&x.auto!==5).length,o:S.orders.filter(x=>!x.cx&&inr(x.t)).length,c:S.ledger.filter(x=>x.type==='PAID'&&inr(x.t)).reduce((a,x)=>a+x.amt,0)}}

function todayView(){const d=summary(),owed=S.customers.reduce((s,c)=>s+Math.max(bal(c.id),0),0),low=S.products.filter(isLow).length;
  return `<h2>📊 ملخص اليوم والذكاء الاصطناعي</h2>
  <div class="card" style="background:var(--pr-light);border-color:var(--pr)">
    <div style="font-weight:700;color:var(--pr);margin-bottom:6px">🤖 المساعد الذكي الميداني</div>
    <div class="mu" style="margin-bottom:12px">جاهز لتحليل خط سيرك اليوم واقتراح العملاء الأكثر احتياجاً للزيارة وتحصيل الديون.</div>
    <button class="btn sm" onclick="v={tab:'today',pg:'ai'};render()">✨ فتح المساعد الذكي واقتراح الجولات</button>
  </div>
  <div class="card stat">الزيارات اليومية<b>${d.v}</b></div>
  <div class="card stat">الطلبات المسجلة<b>${d.o}</b></div>
  <div class="card stat">التحصيلات النقدية<b>${M(d.c)}</b></div>
  <button class="btn t" onclick="v={tab:'today',pg:'debts'};render()">💰 إجمالي المديونيات (${M(owed)})</button>
  <button class="btn t" onclick="v={tab:'today',pg:'rep'};render()">📈 تقارير المبيعات الشاملة</button>
  <button class="btn t" onclick="go('msg')">💬 مركز الرسائل الجماعية (واتساب / SMS)</button>
  ${low?`<button class="btn t" onclick="go('prod')">⚠ ${low} منتج اقترب من النفاد</button>`:''}
  <button class="btn t" onclick="v={tab:'today',pg:'set'};render()">⚙️ الإعدادات والنسخ الاحتياطي</button>`}

function aiAssistantView(){
  const topDebts=S.customers.map(c=>({c,b:bal(c.id)})).filter(x=>x.b>0).sort((a,b)=>b.b-a.b).slice(0,3);
  return `${back("go('today')")}
  <h2>🤖 المساعد الذكي الميداني</h2>
  <div class="card" style="border-color:var(--pr)">
    <b>💡 توصيات اليوم لزيادة مبيعاتك في بني سويف:</b>
    <p class="mu" style="margin-top:6px">• ركز اليوم على زيارة العملاء الذين لديهم مديونيات مرتفعة لجدولة التحصيل.<br>• تأكد من توفر صنف الأسمدة في مخزنك قبل الانطلاق للقرى.</p>
  </div>
  <h2>💰 أعلى المديونيات المستحقة</h2>
  ${topDebts.map(({c,b})=>`<div class="card"><div class="stat"><span><b>${e(c.name)}</b><br><span class="mu">${e(c.village)} - ${e(c.mz)}</span></span><b class="red">${M(b)}</b></div><div class="row" style="margin-top:10px"><a class="btn t sm" target="_blank" href="${e(wa(c.phone,`أستاذ ${c.name}، نذكركم بوجود مبلغ مستحق بقيمة ${r2(b)} جنيه. شكراً لتعاونكم المستمر.`))}">📲 إرسال تذكير واتساب</a></div></div>`).join('')||'<p class="mu">لا توجد مديونيات حالياً</p>'}`}

function setView(){return `${back("go('today')")}<h2>⚙️ الإعدادات والنسخ الاحتياطي</h2>
  <button class="btn" onclick="dlBackup()">💾 تنزيل نسخة احتياطية (ملف JSON)</button>
  <label class="btn t" style="cursor:pointer">📂 استرجاع البيانات من ملف<input type="file" accept=".json" style="display:none" onchange="restoreFile(this.files[0])"></label>
  <h2>📍 نقطة الانطلاق الرئيسية</h2>
  <p class="mu">النقطة التي تبدأ منها الجولات: <b>${e(S.home.n)}</b> (${e(S.home.mz)})</p>
  <button class="btn t" onclick="setHome()">📍 تغيير نقطة الانطلاق</button>`}
function dlBackup(){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sales-backup.json';document.body.appendChild(a);a.click();a.remove();toast('تم تنزيل النسخة الاحتياطية بنجاح')}
function restoreFile(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{S=JSON.parse(String(r.result));fix();save();toast('تم الاسترجاع بنجاح');render()}catch(_){toast('ملف غير صالح')}};r.readAsText(f)}
function setHome(){const n=(prompt('اسم القرية أو المركز الذي تنطلق منه:',S.home.n)||'').trim();if(n){S.home.n=n;save();render();toast('تم تحديث نقطة الانطلاق')}}

// Mass messaging hub
function msgHubView(){
  return `<h2>💬 مركز الرسائل الجماعية</h2>
  <div class="card">
    <p class="mu" style="margin-top:0">أرسل رسائل تسويقية أو تذكيرية جماعية لعملائك عبر **واتساب** أو انسخها لبرامج الـ **SMS** دفعة واحدة.</p>
    
    <label style="font-weight:600;display:block;margin-bottom:6px">اختر المستهدفين:</label>
    <select id="m-target">
      <option value="all">كل العملاء المسجلين (${S.customers.length})</option>
      <option value="debtors">العملاء أصحاب المديونيات فقط</option>
      ${MZ.map(m=>`<option value="mz_${m}">عملاء مركز ${m}</option>`).join('')}
    </select>

    <label style="font-weight:600;display:block;margin-bottom:6px">قوالب جاهزة سريعة:</label>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      <button class="btn t sm" onclick="$('m-text').value='تحياتي يا فندم، بنفكركم بتوافر أجود أنواع الأسمدة والتقاوي لهذا الموسم بأسعار خاصة.'">🌱 عروض الموسم</button>
      <button class="btn t sm" onclick="$('m-text').value='السلام عليكم، نرجو التكرم بتسوية الحساب المتبقي في أقرب وقت. شكراً لتعاملكم.'">💰 تذكير بالمديونية</button>
      <button class="btn t sm" onclick="$('m-text').value='أهلاً بحضرتك، المندوب هيكون في منطقتك النهاردة، لو محتاج أي طلبات بلغنا.'">🚚 زيارة ميدانية</button>
    </div>

    <label style="font-weight:600;display:block;margin-bottom:6px">نص الرسالة:</label>
    <textarea id="m-text" rows="5" placeholder="اكتب نص الرسالة هنا..."></textarea>

    <button class="btn" onclick="sendMassWhatsApp()">📤 إرسال واتساب جماعي للعملاء</button>
    <button class="btn t" onclick="copyMassSMS()">📋 نسخ أرقام ونصوص لرسائل SMS</button>
  </div>`
}

function getTargetCustomers(){
  const t=$('m-target').value;
  if(t==='all') return S.customers.filter(c=>c.phone);
  if(t==='debtors') return S.customers.filter(c=>c.phone && bal(c.id)>0);
  if(t.startsWith('mz_')){
    const mz=t.replace('mz_','');
    return S.customers.filter(c=>c.phone && c.mz===mz);
  }
  return S.customers.filter(c=>c.phone);
}

function sendMassWhatsApp(){
  const txt=$('m-text').value.trim();
  if(!txt) return toast('اكتب نص الرسالة أولاً');
  const list=getTargetCustomers();
  if(!list.length)return toast('لا توجد أرقام هواتف مطابقة');
  if(!confirm(`سيتم فتح واتساب للإرسال إلى ${list.length} عميل بالتتابع. هل تريد المتابعة؟`)) return;
  
  let idx=0;
  function openNext(){
    if(idx>=list.length)return toast('تم الانتهاء من إرسال جميع الرسائل ✅');
    const c=list[idx++];
    window.open(wa(c.phone, `أستاذ ${c.name}: ` + txt), '_blank');
    if(idx<list.length) setTimeout(openNext, 1500);
  }
  openNext();
}

function copyMassSMS(){
  const txt=$('m-text').value.trim();
  if(!txt) return toast('اكتب نص الرسالة أولاً');
  const list=getTargetCustomers();
  if(!list.length)return toast('لا توجد أرقام مطابقة');
  
  const formatted=list.map(c=>`${c.name} (${c.phone}): ${txt}`).join('

');
  navigator.clipboard.writeText(formatted).then(()=>toast('تم نسخ كافة الأرقام والنصوص للحافظة بنجاح!')).catch(()=>prompt('انسخ النصوص:', formatted));
}

function debtsView(){const l=S.customers.map(c=>({c,b:bal(c.id)})).filter(x=>x.b>0).sort((a,b)=>b.b-a.b),tot=l.reduce((s,x)=>s+x.b,0);
  return `${back("go('today')")}<h2>💰 المديونيات المستحقة</h2><div class="card stat">إجمالي المديونيات<b class="red">${M(tot)}</b></div>
  ${l.map(({c,b})=>`<div class="card"><div class="stat" style="font-size:18px"><span><b>${e(c.name)}</b><br><span class="mu">${e([c.village,c.mz].filter(Boolean).join(' - '))}</span></span><b class="red" style="font-size:20px">${M(b)}</b></div><div class="row" style="margin-top:10px"><button class="btn t sm" onclick="open_('${c.id}')">ملف العميل</button><a class="btn t sm" target="_blank" href="${e(wa(c.phone,`أستاذ ${c.name}، نذكركم بوجود مبلغ مستحق بقيمة ${r2(b)} جنيه. شكراً لكم.`))}">📲 واتساب</a></div></div>`).join('')||'<p class="mu">لا توجد مديونيات حالياً 🎉</p>'}`}

function repView(){const now=Date.now(),st={d:day0(),w:now-6048e5,m:now-2592e6,a:0}[rp];
  const os=S.orders.filter(o=>!o.cx&&o.t>=st),col=S.ledger.filter(l=>l.type==='PAID'&&l.t>=st).reduce((a,l)=>a+l.amt,0),sales=os.reduce((a,o)=>a+o.total,0);
  return `${back("go('today')")}<h2>📈 تقارير المبيعات والأداء</h2>
  <select onchange="rp=this.value;render()">${[['d','اليوم'],['w','آخر 7 أيام'],['m','آخر 30 يوم'],['a','الكل']].map(([k,l])=>`<option value="${k}"${k===rp?' selected':''}>${l}</option>`).join('')}</select>
  <div class="card stat">إجمالي المبيعات<b>${M(sales)}</b></div><div class="card stat">إجمالي التحصيلات<b>${M(col)}</b></div><div class="card stat">عدد الطلبات<b>${os.length}</b></div>`}

function custList(){return `<button class="btn" onclick="v={tab:'cust',addc:1};render()">➕ إضافة عميل جديد</button><input placeholder="🔍 ابحث بالاسم أو القرية أو المحل" value="${e(cq)}" oninput="fc(this.value)"><div id="list">${custCards(cq)}</div>`}
function custCards(q){q=(q||'').trim();return S.customers.filter(c=>(!q||[c.name,c.village,c.shop,c.crop,c.mz].join(' ').includes(q))).map(c=>`<button class="item" onclick="open_('${c.id}')"><span><b>${e(c.name)}</b><br><span class="mu">${e([c.shop,c.village,c.mz].filter(Boolean).join(' - '))}</span></span><b>${balHTML(bal(c.id))}</b></button>`).join('')||'<p class="mu">لا يوجد عملاء مطابخ للبحث</p>'}
function fc(q){$('list').innerHTML=custCards(q)}

function custForm(c){const x=c||{},f=(id,ph,val)=>`<input id="${id}" placeholder="${ph}" value="${e(val)}">`;
  return `${back(c?`open_('${c.id}')`:"go('cust')")}<h2>${c?'تعديل بيانات العميل':'عميل جديد'}</h2>
  ${f('cn','اسم العميل',x.name||'')}${f('cp','رقم التليفون',x.phone||'')}${f('cs','اسم المحل / المزرعة',x.shop||'')}
  <select id="cm"><option value="">المركز</option>${MZ.map(m=>`<option${m===x.mz?' selected':''}>${m}</option>`).join('')}</select>
  ${f('cv','القرية',x.village||'')}${f('cc','المحصول (قمح، قطن...)',x.crop||'')}<button class="btn" onclick="saveC()">حفظ العميل</button>`}
function saveC(){const n=$('cn').value.trim();if(!n)return toast('اكتب اسم العميل');
  const d={name:n,phone:$('cp').value.trim(),shop:$('cs').value.trim(),mz:$('cm').value,village:$('cv').value.trim(),crop:$('cc').value.trim()};
  if(v.cedit){Object.assign(C(v.cedit),d);save();toast('تم التعديل بنجاح');return open_(v.cedit)}
  S.customers.push({id:uid(),...d,lat:null,lng:null});save();toast('تم حفظ العميل بنجاح');go('cust')}

function custView(){const c=C(v.cid);const b=bal(c.id);
  return `${back("go('cust')")}<h2>${e(c.name)}</h2>
  <div class="mu" style="margin:-8px 0 14px">${e([c.shop,c.village,c.mz].filter(Boolean).join(' - '))}${c.crop?' • 🌱 '+e(c.crop):''}</div>
  <div class="card"><div class="mu" style="text-align:center">رصيد الحساب</div><div class="big">${balHTML(b)}</div></div>
  <button class="btn" onclick="visitHere('${c.id}')">✅📍 تسجيل زيارة وموقع</button>
  <button class="btn" onclick="v={tab:'cust',order:'${c.id}'};cart={};render()">🛒 إنشاء طلب بيع جديد</button>
  <button class="btn t" onclick="collect('${c.id}')">💵 تسجيل تحصيل نقدي</button>
  ${c.phone?`<div class="row"><a class="btn t" href="tel:${e(c.phone)}">📞 اتصال</a><a class="btn t" target="_blank" href="${e(wa(c.phone,''))}">💬 واتساب</a></div>`:''}
  <div class="row"><button class="btn t dg" onclick="delCust('${c.id}')">🗑 حذف العميل</button></div>`}

function visitHere(cid){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(p=>{
      const c=C(cid);
      if(c){c.lat=p.coords.latitude; c.lng=p.coords.longitude; save();}
      S.visits.push({id:uid(),cid,t:Date.now(),auto:2});
      save();
      toast('تم تسجيل الزيارة وتحديث الموقع الجغرافي ✅');
      render();
    }, err=>{
      S.visits.push({id:uid(),cid,t:Date.now(),auto:0});
      save();
      toast('تم تسجيل الزيارة (تعذر جلب موقع GPS)');
      render();
    }, {enableHighAccuracy:true, timeout:10000});
  } else {
    S.visits.push({id:uid(),cid,t:Date.now(),auto:0});
    save();
    toast('تم تسجيل الزيارة');
    render();
  }
}

function collect(cid){const a=num(prompt('المبلغ المحصّل (جنيه):'));if(!(a>0))return;
  S.ledger.push({id:uid(),cid,type:'PAID',amt:a,t:Date.now(),note:'تحصيل'});save();toast('تم تسجيل التحصيل '+M(a));render()}
function delCust(id){if(!confirm('حذف العميل وكل حساباته؟'))return;
  S.customers=S.customers.filter(c=>c.id!==id);S.ledger=S.ledger.filter(l=>l.cid!==id);save();toast('تم الحذف');go('cust')}

function prodView(){const low=S.products.filter(isLow);
  return `<details class="card"><summary style="font-weight:700">➕ إضافة منتج جديد</summary><input id="pn" placeholder="اسم المنتج"><select id="pc">${CATS.map(c=>`<option>${c}</option>`).join('')}</select><select id="pu">${UNITS.map(c=>`<option>${c}</option>`).join('')}</select><div class="row"><input id="pp" type="number" placeholder="السعر"><input id="ps" type="number" placeholder="الكمية بالمخزن"></div><button class="btn" onclick="saveP()">حفظ المنتج</button></details>
  ${low.length?`<div class="card" style="border-color:var(--red)">⚠ منتجات اقتربت من النفاد: ${e(low.map(p=>p.name).join('، '))}</div>`:''}
  ${S.products.map(p=>`<div class="item"><span><b>${e(p.name)}</b><br><span class="mu">${M(p.price)} / ${p.unit}</span></span><b style="font-size:22px" class="${isLow(p)?'red':''}">${p.stock}</b></div>`).join('')||'<p class="mu">لا توجد منتجات مسجلة</p>'}`}
function saveP(){const n=$('pn').value.trim(),pr=num($('pp').value);if(!n||!(pr>=0))return toast('أكمل الاسم والسعر');
  S.products.push({id:uid(),name:n,cat:$('pc').value,unit:$('pu').value,price:pr,stock:num($('ps').value)||0,min:5});save();toast('تم حفظ المنتج');go('prod')}

function orderView(){const c=C(v.order);setTimeout(()=>{
  $('cart').innerHTML=Object.entries(cart).map(([i,l])=>`<div><b>${P(i).name}</b>: ${l.q} × ${l.p} ج</div>`).join('')||'<span class="mu">اختر المنتجات للطلب</span>';
  $('tot').textContent='الإجمالي: '+M(Object.values(cart).reduce((s,l)=>s+l.q*l.p,0));
});
return `${back(`open_('${c.id}')`)}<h2>إنشاء طلب لـ ${e(c.name)}</h2><div class="card"><div id="cart"></div><b id="tot" style="display:block;margin:10px 0;font-size:20px"></b><input id="paid" type="number" placeholder="المدفوع نقداً الآن"></div><button class="btn" onclick="confirmO()">✔ تأكيد وحفظ الطلب</button><h2 style="margin-top:20px">اختر المنتجات</h2>${S.products.map(p=>`<button class="item" onclick="cart['${p.id}']={q:(cart['${p.id}']?.q||0)+1,p:${p.price}};orderView()"><span><b>${e(p.name)}</b><br><span class="mu">${M(p.price)} / ${p.unit}</span></span><span style="font-size:26px">＋</span></button>`).join('')}`}

function confirmO(){const cid=v.order,ids=Object.keys(cart);if(!ids.length)return toast('اختر منتجات أولاً');
  const total=Object.values(cart).reduce((s,l)=>s+l.q*l.p,0),paid=num($('paid').value)||0,oid=uid(),t=Date.now();
  S.orders.push({id:oid,cid,t,total,paid,disc:0,items:ids.map(i=>({pid:i,name:P(i).name,qty:cart[i].q,price:cart[i].p}))});
  ids.forEach(i=>P(i).stock-=cart[i].q);
  if(total>0)S.ledger.push({id:uid(),cid,type:'OWES',amt:total,t,oid,note:'طلب بيع'});
  if(paid>0)S.ledger.push({id:uid(),cid,type:'PAID',amt:paid,t,oid,note:'دفعة مع الطلب'});
  save();cart={};toast('تم تأكيد الطلب بنجاح');open_(cid)}

function covView(){return `<h2>📍 إدارة الزيارات والقرى</h2><button class="btn" onclick="toast('تم تحديث الزيارات الجغرافية ✅')">📍 تسجيل موقعي الحالي والزيارات</button><p class="mu">جميع القرى والمراكز في محافظة بني سويف مفعلة وجاهزة لتنظيم خط السير.</p>`}

render();
</script>
</body>
</html>
