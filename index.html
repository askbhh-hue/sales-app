<style>
:root{--bg:#f4efe4;--surf:#fffdf8;--surf2:#f6f1e5;--line:#e2d9c4;--tx:#1d2a22;--mu:#6a6e62;--pr:#1f4d2e;--pr2:#2d6a43;--prt:#fffdf8;--prl:#e3ebdf;--acc:#b98a2e;--accl:#f3e8cc;--ring:rgba(31,77,46,.18);--dot:rgba(31,77,46,.07);--red:#b3261e;--redl:#fbe7e4;--grn:#2e7d4f;--grnl:#e1efe6;--amb:#8a5a00;--ambl:#f8ebcf;--blu:#2a5d8f;--blul:#e3ecf6;--sh:0 1px 2px rgba(42,34,16,.05),0 8px 22px rgba(42,34,16,.07);--r:18px;--r2:12px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1711;--surf:#13211a;--surf2:#182a20;--line:#27392d;--tx:#f0ead9;--mu:#a6b09f;--pr:#63b07a;--pr2:#7cc592;--prt:#0b1810;--prl:#193325;--acc:#e2b458;--accl:#2c2513;--ring:rgba(99,176,122,.25);--dot:rgba(99,176,122,.07);--red:#ff9184;--redl:#3a201d;--grn:#8fd6a4;--grnl:#193325;--amb:#ffc96b;--ambl:#382c15;--blu:#a2c9f0;--blul:#1a2c3c;--sh:0 1px 2px rgba(0,0,0,.35),0 10px 26px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1711;--surf:#13211a;--surf2:#182a20;--line:#27392d;--tx:#f0ead9;--mu:#a6b09f;--pr:#63b07a;--pr2:#7cc592;--prt:#0b1810;--prl:#193325;--acc:#e2b458;--accl:#2c2513;--ring:rgba(99,176,122,.25);--dot:rgba(99,176,122,.07);--red:#ff9184;--redl:#3a201d;--grn:#8fd6a4;--grnl:#193325;--amb:#ffc96b;--ambl:#382c15;--blu:#a2c9f0;--blul:#1a2c3c;--sh:0 1px 2px rgba(0,0,0,.35),0 10px 26px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:22px 22px;color:var(--tx);font-family:Cairo,"IBM Plex Sans Arabic",-apple-system,BlinkMacSystemFont,"SF Arabic","Geeza Pro",Tahoma,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.6;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
main{max-width:720px;margin:0 auto;padding:0 14px}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.2px;line-height:1.25}
h2{margin:22px 2px 10px;font-size:15px;font-weight:700;color:var(--mu);display:flex;align-items:center}
h2::before{content:"";display:inline-block;width:14px;height:3px;border-radius:3px;background:var(--acc);margin-inline-end:8px;flex:none}
.sh{position:sticky;top:0;z-index:20;margin:0 -14px 14px;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.sh .sub{color:var(--mu);font-size:13px;margin-top:2px}
.shrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.topbar{position:sticky;top:0;z-index:20;margin:0 -14px 12px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.backbtn{border:1px solid var(--line);background:var(--surf);color:var(--tx);border-radius:12px;min-height:42px;padding:8px 14px;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.hero{background:linear-gradient(150deg,var(--pr) 0%,var(--pr2) 100%);color:var(--prt);border:0}
.hero .mu{color:#f3d68e;opacity:1}
.hero .hs{opacity:.92}
.herobox{background:var(--surf);border:1px solid var(--line);border-top:4px solid var(--acc);box-shadow:var(--sh)}
.herobox .hs{color:var(--mu)}
.hn{font-size:22px;font-weight:700;margin-top:4px;letter-spacing:-.2px}
.hs{font-size:14px;margin-top:4px}
.bigbal{font-size:34px;font-weight:700;margin-top:10px;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:0;border-radius:var(--r2);background:var(--pr);color:var(--prt);font:inherit;font-size:15px;font-weight:600;margin:0 0 10px;padding:12px 14px;cursor:pointer;text-align:center;text-decoration:none;line-height:1.3;transition:transform .08s,opacity .15s,background .15s}
.btn:active{transform:scale(.985)}
.btn.t{background:var(--surf);color:var(--tx);border:1px solid var(--line)}
.btn.sm{min-height:40px;font-size:14px;padding:8px 10px;margin:0;border-radius:10px}
.btn.dg{color:var(--red);border-color:var(--red)}
.btn:disabled,.btn.off{opacity:.45;pointer-events:none}
.linkbtn{background:none;border:0;color:var(--pr);font:inherit;font-weight:600;font-size:15px;cursor:pointer;padding:10px}
input,select,textarea{width:100%;min-height:50px;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surf);color:var(--tx);margin:0 0 10px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--pr);box-shadow:0 0 0 3px var(--ring)}
label.lb{display:block;font-size:13px;color:var(--mu);margin:0 2px 6px;font-weight:600}
.stat{display:flex;justify-content:space-between;align-items:center;font-size:17px}.stat b{font-size:22px}
.mu{color:var(--mu);font-size:14px}.red{color:var(--red)}.grn{color:var(--grn)}.amb{color:var(--amb)}
.item{display:flex;align-items:center;gap:10px;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px;box-shadow:var(--sh)}
.itm-main{all:unset;display:flex;align-items:center;gap:12px;flex:1;min-width:0;cursor:pointer}
.itm-main:focus-visible{outline:3px solid var(--ring);border-radius:12px}
.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nm{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb{font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fffdf8;font-weight:700;font-size:15px;letter-spacing:.3px}
.icobtn{flex:none;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surf2);color:var(--tx);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap;flex:none}
.pill.red{background:var(--redl);color:var(--red)}.pill.grn{background:var(--grnl);color:var(--grn)}.pill.amb{background:var(--ambl);color:var(--amb)}.pill.blu{background:var(--blul);color:var(--blu)}.pill.gray{background:var(--surf2);color:var(--mu)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surf);color:var(--tx);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;min-height:38px}
.chip.on{background:var(--pr);border-color:var(--pr);color:var(--prt)}
.seg{display:flex;background:var(--surf2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;color:var(--mu);font:inherit;font-weight:600;font-size:14px;min-height:40px;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--surf);color:var(--pr);box-shadow:var(--sh)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh);text-align:right;font:inherit;color:inherit;cursor:default;border-inline-start:3px solid var(--acc)}
button.kpi{cursor:pointer}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums;color:var(--pr)}
.kpi .v.red{color:var(--red)}
.kpi .l{font-size:13px;color:var(--mu);margin-top:2px}
.grid2,.grid3,.grid4{display:grid;gap:10px;margin-bottom:10px}
.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr 1fr}.grid4{grid-template-columns:repeat(4,1fr);gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px 8px;min-height:92px;font:inherit;font-size:14px;font-weight:600;color:var(--tx);text-decoration:none;cursor:pointer;box-shadow:var(--sh);text-align:center;line-height:1.3}
.tile .ti{font-size:24px;line-height:1}
.tile.pri{background:var(--pr);color:var(--prt);border-color:transparent}
.tile.big{min-height:104px}
.tile.sm2{min-height:70px;font-size:13px}
.tile.sm2 .ti{font-size:21px}
.alert{border-radius:var(--r);padding:14px 16px;margin-bottom:12px;border:1px solid var(--line);background:var(--surf);box-shadow:var(--sh)}
.alert.red{background:var(--redl);border-color:transparent}.alert.amb{background:var(--ambl);border-color:transparent}.alert.blu{background:var(--blul);border-color:transparent}.alert.grn{background:var(--grnl);border-color:transparent}
.empty{text-align:center;color:var(--mu);padding:30px 16px;font-size:15px}
.empty .ico{font-size:38px;margin-bottom:8px}
.bar{flex:1;height:8px;border-radius:9px;background:var(--surf2);overflow:hidden;margin-left:10px}
.bar span{display:block;height:100%;background:var(--pr);border-radius:9px}
.acts{display:flex;align-items:center;gap:6px;flex:none}
.step{display:inline-flex;align-items:center;gap:4px;background:var(--surf2);border:1px solid var(--line);border-radius:14px;padding:4px;flex:none}
.step button{width:42px;height:42px;border:0;border-radius:11px;background:var(--surf);color:var(--tx);font-size:20px;font-weight:600;cursor:pointer;box-shadow:var(--sh)}
.step b{min-width:34px;text-align:center;font-size:17px}
.qb{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surf);color:var(--tx);font-size:20px;font-weight:600;cursor:pointer;box-shadow:var(--sh)}
.big,.stat b{font-variant-numeric:tabular-nums}
details.card>summary{cursor:pointer;list-style:none;font-weight:700;min-height:44px;display:flex;align-items:center}
details.card>summary::-webkit-details-marker{display:none}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--surf);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;box-shadow:0 -8px 24px rgba(42,34,16,.08)}
.foot .fi{flex:1;min-width:0}
.foot .fi b{font-size:18px;font-weight:700;display:block;color:var(--pr)}
.foot .btn{flex:none;width:auto;margin:0;padding:12px 18px}
.pad-foot{padding-bottom:124px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.keypad button{min-height:62px;border:1px solid var(--line);border-radius:14px;background:var(--surf2);color:var(--tx);font:inherit;font-size:24px;font-weight:600;cursor:pointer}
.keypad button.fn{font-size:18px;color:var(--mu)}
.amt{font-size:42px;font-weight:700;text-align:center;padding:8px 0;letter-spacing:-.4px;font-variant-numeric:tabular-nums;color:var(--pr)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:2px;background:var(--surf);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px rgba(42,34,16,.06)}
nav.hide{display:none}
nav button{flex:1;min-width:0;min-height:58px;border:0;background:transparent;color:var(--mu);font:inherit;font-size:12px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:14px;position:relative;transition:background .15s,color .15s}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--pr);background:var(--prl);font-weight:700}
nav button.on::before{content:"";position:absolute;top:0;left:32%;right:32%;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}
#scrim{position:fixed;inset:0;background:rgba(20,28,22,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#scrim.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surf);border-radius:24px 24px 0 0;box-shadow:0 -12px 32px rgba(20,28,22,.25);transform:translateY(105%);transition:transform .25s ease;max-height:88vh;overflow:auto;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto}
#sheet.open{transform:translateY(0)}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:15px;display:none;z-index:70;box-shadow:0 10px 26px rgba(0,0,0,.25);max-width:90vw;text-align:center}
pre{white-space:pre-wrap;font:inherit;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{nav,.btn,#toast,.foot,#sheet,#scrim{display:none!important}body{padding:0}}
</style>
<style id="enh">
:root{--c-cust:#1f7a4d;--c-prod:#b35f0e;--c-map:#2563a8;--c-rep:#6a48a6;--c-debt:#b3261e;--c-trk:#0f7a72;--c-msg:#4456b5;--c-set:#4f5a63;--c-imp:#8a6512}
:root[data-theme=dark],:root:not([data-theme=light]){}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#08110d;--surf:#111d17;--surf2:#17271f;--line:#1c2e24;--tx:#f1f8f3;--mu:#a9bdb0;--pr:#4dffb0;--pr2:#7dffc6;--prt:#03130b;--prl:#143a29;--ring:rgba(77,255,176,.35);--dot:transparent;--c-cust:#6dffb8;--c-prod:#ffb86b;--c-map:#8fc4ff;--c-rep:#c9b4ff;--c-debt:#ff9c92;--c-trk:#6fe9de;--c-msg:#aab8ff;--c-set:#c3cdd6;--c-imp:#f0d27a}}
:root[data-theme=dark]{--bg:#08110d;--surf:#111d17;--surf2:#17271f;--line:#1c2e24;--tx:#f1f8f3;--mu:#a9bdb0;--pr:#4dffb0;--pr2:#7dffc6;--prt:#03130b;--prl:#143a29;--ring:rgba(77,255,176,.35);--dot:transparent;--c-cust:#6dffb8;--c-prod:#ffb86b;--c-map:#8fc4ff;--c-rep:#c9b4ff;--c-debt:#ff9c92;--c-trk:#6fe9de;--c-msg:#aab8ff;--c-set:#c3cdd6;--c-imp:#f0d27a}
h1{font-size:26px;font-weight:800}
h2{font-size:17px;font-weight:700;color:var(--tx);margin:26px 2px 12px}
.sub,.sb,.mu{font-size:14px}.nm{font-size:17px;font-weight:700}
.card,.item,.tile,.kpi,.alert{border:0;box-shadow:none}
.item{padding:14px;border-radius:18px}.card{padding:18px;margin-bottom:14px}
.sh,.topbar{border-bottom:0}
.btn{min-height:58px;padding:15px 18px;font-size:17px;font-weight:700;border-radius:16px}
.btn:not(.t):not(.dg){box-shadow:0 0 0 1px var(--pr),0 6px 20px -6px var(--ring)}
.btn.t{border:0;background:var(--surf2);color:var(--tx)}
.btn.sm{min-height:46px}
.chip{border:0;background:var(--surf2);min-height:44px;padding:10px 18px;font-size:15px}
.icobtn{width:48px;height:48px;border:0;background:var(--c-cust-bg,var(--surf2));color:var(--c-cust)}
.tile{min-height:104px;padding:16px 8px;font-size:15px;gap:8px}
.tile.sm2{min-height:80px}
.ti{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:22px;background:color-mix(in srgb,var(--ic,var(--tx)) 16%,transparent);color:var(--ic,var(--tx))}
.ti svg,.icobtn svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tile.pri .ti{background:rgba(0,0,0,.14);color:var(--prt)}
.tile:active,.btn:active,.chip:active,.icobtn:active,.item:active{transform:scale(.96);transition:transform .08s}
nav{border-top:0;padding-top:8px;box-shadow:0 -10px 30px rgba(0,0,0,.18)}
nav button{min-height:62px;font-size:13px}

.empty{padding:40px 20px;font-size:17px}.empty .ico{font-size:46px}.empty .btn{margin:18px auto 0;max-width:340px}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 14px}
.qa button{border:0;border-radius:16px;min-height:76px;background:var(--surf);color:var(--tx);font:inherit;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.qa button.p{background:var(--pr);color:var(--prt)}
.qa svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#toast.pop{animation:tp .28s ease-out}@keyframes tp{from{transform:translateX(-50%) scale(.85);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}

.pp{padding:9px 12px;background:#1f4d2e;color:#fff!important;border-radius:10px;text-decoration:none;font-weight:700}body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:25}

<body>
<main id="main"></main>
<nav id="nav" aria-label="التنقل الرئيسي"><button id="n-cov" onclick="go('cov')" aria-label="الزيارات"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11A6.5 6.5 0 0 1 18.5 10c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>الزيارات</button><button id="n-cust" onclick="go('cust')" aria-label="العملاء"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.2 19.5c.9-3.1 3.1-4.9 5.8-4.9s4.9 1.8 5.8 4.9"/><circle cx="16.8" cy="9" r="2.5"/><path d="M15.8 14.7c2.4.3 4.1 2 4.9 4.8"/></svg>العملاء</button><button id="n-today" onclick="go('today')" aria-label="اليوم"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11M10 20V5M16 20v-7M3 20h18"/></svg>اليوم</button><button id="n-ai" onclick="go('ai')" aria-label="المساعد"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l1.7 4.3 4.3 1.7-4.3 1.7L12 15.5l-1.7-4.3L6 9.5l4.3-1.7z"/><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>المساعد</button><button id="n-more" onclick="go('more')" aria-label="المزيد"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.8" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none"/><circle cx="18.5" cy="12" r="1.8" fill="currentColor" stroke="none"/></svg>المزيد</button></nav>
<div id="scrim" onclick="closeSheet()"></div>
<div id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<div id="toast"></div>
<script>
const K='fs_v1',CATS=['أسمدة','مبيدات'],UNITS=['شيكارة','زجاجة','لتر','كيلو','علبة','كيس','عبوة'],MZ=['بني سويف','ناصر','إهناسيا','ببا','الفشن','سمسطا','الواسطى','الفيوم'];
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(_){}
function fix(){S=S||{};['products','customers','orders','ledger','visits'].forEach(k=>S[k]=S[k]||[]);S.pin=S.pin||'';S.lb=S.lb||0;S.pv=S.pv||[];S.places=S.places||[];S.cyc=S.cyc||14;S.hide=S.hide||[];S.msgLog=S.msgLog||[];S.home=S.home||{n:'أطواب',mz:'الواسطى'};S.products.forEach(p=>{if(!CATS.includes(p.cat))p.cat='أسمدة'})}
function migrate(){if(S.mig)return;S.orders.forEach(o=>{if(o.cx||!(o.paid>0))return;const l=S.ledger.find(x=>x.oid===o.id&&x.type==='OWES');
  if(l){if(Math.abs(l.amt-(o.total-o.paid))<0.01)l.amt=o.total}else S.ledger.push({id:uid(),cid:o.cid,type:'OWES',amt:o.total,t:o.t,oid:o.id,note:'طلب'})});S.mig=1;save()}
fix();
let v={tab:'cov'},cart={},rp='w',unl=!S.pin,cq='';
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(_){toast('تعذر الحفظ على المتصفح')}};
let uidc=0;const uid=()=>Date.now().toString(36)+(uidc++).toString(36)+Math.random().toString(36).slice(2,6);
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M=n=>(Math.round(n*100)/100).toLocaleString('en-US')+' ج';
const num=s=>parseFloat(String(s??'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace('٫','.').replace(',','.'));
const $=i=>document.getElementById(i);
const P=i=>S.products.find(p=>p.id===i),C=i=>S.customers.find(c=>c.id===i);
const bal=c=>S.ledger.filter(l=>l.cid===c).reduce((s,l)=>s+(l.type==='OWES'?l.amt:-l.amt),0);
const day0=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
const dt=t=>new Date(t).toLocaleDateString('en-GB');
const r2=n=>Math.round(n*100)/100;
const isLow=p=>p.min>0?p.stock<=p.min:p.stock<=0;
function waNum(p){let d=String(p||'').replace(/[٠-٩]/g,x=>'٠١٢٣٤٥٦٧٨٩'.indexOf(x)).replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0'))d='20'+d.slice(1);return d}
const wa=(p,t)=>'https://wa.me/'+waNum(p)+'?text='+encodeURIComponent(t);
function hap(n){try{navigator.vibrate&&navigator.vibrate(n||10)}catch(_){}}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';t.classList.remove('pop');void t.offsetWidth;t.classList.add('pop');if(/^(تم|اتسجلت)/.test(m)&&!/(الرقم|إلغاء)/.test(m))hap([14,40,14]);clearTimeout(toast.i);toast.i=setTimeout(()=>t.style.display='none',2200)}
function go(t){v={tab:t};cart={};cq='';cnv=0;render()}
function open_(c){v={tab:'cust',cid:c};render()}
function balHTML(b){return b>0?`<span class="red">عليه ${M(b)}</span>`:b<0?`<span class="grn">ليه ${M(-b)}</span>`:'<span class="mu">صفر</span>'}
const back=(f,l)=>`<div class="topbar"><button class="backbtn" onclick="${f}">→ ${l||'رجوع'}</button></div>`;

// ---------- LOCK ----------
function hp(s){let h=5381;for(const c of String(s))h=(h*33+c.charCodeAt(0))>>>0;return String(h)}
function lockView(){return `<h2>🔒 مندوب المبيعات</h2><input id="pin" type="password" inputmode="numeric" placeholder="الرقم السري" onkeydown="if(event.key==='Enter')unlock()"><button class="btn" onclick="unlock()">دخول</button>`}
function unlock(){if(hp($('pin').value)===S.pin){unl=true;render()}else toast('الرقم غلط')}
function setPin(){const p=prompt('اكتب الرقم السري الجديد:');if(!p)return;S.pin=hp(p);save();unl=true;toast('تم تفعيل القفل');render()}
function rmPin(){S.pin='';save();toast('تم إلغاء القفل');render()}

// ---------- UI HELPERS ----------
const AVC=['#1f4d2e','#2a5d8f','#8a5a00','#6b3f7a','#1f6f6a','#8b4a2b','#9a3b5c','#4a4f47'];
function avatar(name,seed){const p=String(name||'؟').trim().split(/\s+/);const ini=((((p[0]||'')[0]||'')+((p[1]||'')[0]||''))).toUpperCase()||'؟';let h=0;String(seed||name||'').split('').forEach(ch=>{h=(h*31+ch.charCodeAt(0))>>>0});return '<span class="av" style="background:'+AVC[h%AVC.length]+'" aria-hidden="true">'+e(ini)+'</span>'}
function screenHead(title,sub,act){return '<div class="sh"><div class="shrow"><div style="min-width:0"><h1>'+title+'</h1>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div>'+(act||'')+'</div></div>'}
function openSheet(h){$('sheetBody').innerHTML=h;$('sheet').classList.toggle('open',true);$('scrim').classList.toggle('open',true)}
function closeSheet(){$('sheet').classList.toggle('open',false);$('scrim').classList.toggle('open',false)}
function moreView(){return screenHead('المزيد','الأدوات والإعدادات')+`
  <div class="grid2">
    <button class="tile" onclick="go('map')"><span class="ti">🗺️</span>الخريطة</button>
    <button class="tile" onclick="go('prod')"><span class="ti">📦</span>المنتجات</button>
    <button class="tile" onclick="v={tab:'today',pg:'rep'};render()"><span class="ti">📈</span>التقارير</button>
    <button class="tile" onclick="v={tab:'today',pg:'debts'};render()"><span class="ti">💰</span>المديونيات</button>
    <button class="tile" onclick="v={tab:'today',pg:'trk'};render()"><span class="ti">🛣</span>خط السير</button>
    <button class="tile" onclick="v={tab:'today',pg:'msg'};render()"><span class="ti">💬</span>رسائل جماعية</button>
    <button class="tile" onclick="v={tab:'cust',imp:1};render()"><span class="ti">📥</span>استيراد عملاء</button>
    <button class="tile" onclick="v={tab:'today',pg:'set'};render()"><span class="ti">⚙️</span>الإعدادات والنسخ</button>
  </div>
  <p class="mu" style="margin:14px 2px">كل البيانات محفوظة على الموبايل ده. اعمل نسخة احتياطية من الإعدادات بانتظام.</p>`}

function render(){
  const navOf={cov:'cov',cust:'cust',today:'today',ai:'ai',more:'more',map:'more',prod:'more'};
  const act=v.pg==='set'?'more':v.pg?'today':(navOf[v.tab]||'today');
  ['cov','cust','today','ai','more'].forEach(t=>{const b=$('n-'+t);if(b)b.classList.toggle('on',act===t)});
  const sub=!unl||!!(v.cid||v.order||v.cedit||v.addc||v.pf||v.stmt||v.inv||v.imp||v.bulk||v.pick);
  const nv=$('nav');if(nv)nv.classList.toggle('hide',sub);
  let h;
  if(!unl)h=lockView();
  else if(v.imp)h=impView();
  else if(v.bulk)h=bulkView();
  else if(v.pick)h=pickView();
  else if(v.pg==='debts')h=debtsView();
  else if(v.pg==='rep')h=repView();
  else if(v.pg==='trk')h=trkView();
  else if(v.pg==='msg')h=msgView();
  else if(v.pg==='set')h=setView();
  else if(v.stmt)h=stmtView();
  else if(v.inv)h=invView();
  else if(v.cedit||v.addc)h=custForm(v.cedit?C(v.cedit):null);
  else if(v.pf)h=prodForm(P(v.pf));
  else if(v.cid)h=custView();
  else if(v.order)h=orderView();
  else h=v.tab==='cust'?custList():v.tab==='cov'?covView():v.tab==='prod'?prodView():v.tab==='map'?mapView():v.tab==='ai'?aiView():v.tab==='more'?moreView():todayView();
  $('main').innerHTML=h;window.scrollTo(0,0);
}

// ---------- TODAY / SETTINGS / BACKUP ----------
function summary(){const s=day0(),e2=s+864e5,inr=t=>t>=s&&t<e2;
  return{v:S.visits.filter(x=>inr(x.t)&&x.auto!==5).length,o:S.orders.filter(x=>!x.cx&&inr(x.t)).length,c:S.ledger.filter(x=>x.type==='PAID'&&inr(x.t)).reduce((a,x)=>a+x.amt,0)}}
function todayView(){
  const d=summary(),owed=S.customers.reduce((s,c)=>s+Math.max(bal(c.id),0),0),need=groups().filter(x=>x.cs.length&&x.st>=2).length,old=(S.customers.length+S.orders.length)>0&&Date.now()-S.lb>6048e5;
  const plan=aiTour();
  const next=plan.list.length
    ?`<div class="card hero"><div class="mu">الخطوة الجاية</div><div class="hn">ابدأ بجولة مركز ${e(plan.mz)}</div><div class="hs">${e(plan.list.map(x=>gname(x)).join(' • '))}</div><a class="btn" style="background:var(--surf);color:var(--pr);margin:12px 0 0;box-shadow:none" target="_blank" rel="noopener" href="${e(tourHref(plan.list))}">🧭 افتح المسار على الخرائط</a><button class="btn" style="background:transparent;color:var(--prt);box-shadow:inset 0 0 0 2px var(--prt);margin:8px 0 0" onclick="showTour()">🗺 كل عملاء الجولة على الخريطة</button></div>`
    :`<div class="card" style="text-align:center"><div style="font-size:30px">🎉</div><b>مفيش قرى محتاجة زيارة دلوقتي</b><div class="mu">كل قرى عملائك اتزارت في مواعيدها</div></div>`;
  const rep=encodeURIComponent(`تقرير اليوم\nالزيارات: ${d.v}\nالطلبات: ${d.o}\nالتحصيلات: ${d.c} جنيه`);
  return screenHead('اليوم',e(new Date().toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'})))+`
  ${next}
  ${old?`<div class="alert red">⚠ مفيش نسخة احتياطية من أكتر من أسبوع<br><button class="btn sm" style="margin-top:10px;width:auto" onclick="dlBackup()">💾 نزّل نسخة دلوقتي</button></div>`:''}
  ${todayAlerts()}
  ${need?`<button class="alert amb" style="width:100%;display:block;text-align:right;font:inherit;color:inherit;cursor:pointer;border:0" onclick="go('cov')">📍 ${need} قرية محتاجة زيارة</button>`:''}
  <div class="kpis">
    <div class="kpi"><div class="v">${d.v}</div><div class="l">زيارات النهارده</div></div>
    <div class="kpi"><div class="v">${d.o}</div><div class="l">طلبات النهارده</div></div>
    <div class="kpi"><div class="v">${e(M(d.c))}</div><div class="l">تحصيل النهارده</div></div>
    <button class="kpi" onclick="v={tab:'today',pg:'debts'};render()"><div class="v red">${e(M(owed))}</div><div class="l">عليهم فلوس ←</div></button>
  </div>
  <h2>أعمال سريعة</h2>
  <div class="grid3">
    <button class="tile" onclick="go('cov')"><span class="ti">📍</span>الزيارات</button>
    <button class="tile" onclick="v={tab:'today',pg:'msg'};render()"><span class="ti">💬</span>رسائل</button>
    <button class="tile" onclick="v={tab:'today',pg:'trk'};render()"><span class="ti">🛣</span>خط السير</button>
    <button class="tile" onclick="v={tab:'today',pg:'rep'};render()"><span class="ti">📈</span>التقارير</button>
    <a class="tile" target="_blank" rel="noopener" href="https://wa.me/?text=${rep}"><span class="ti">📤</span>تقرير واتساب</a>
    <button class="tile" onclick="v={tab:'today',pg:'set'};render()"><span class="ti">⚙️</span>الإعدادات</button>
  </div>`}

function setView(){return `${back("go('today')")}<h2>النسخ الاحتياطي</h2>
  <p class="mu">آخر نسخة: ${S.lb?dt(S.lb):'لسه مفيش'}</p>
  <button class="btn" onclick="dlBackup()">💾 تنزيل نسخة احتياطية (ملف)</button>
  <label class="btn t" style="cursor:pointer">📂 استرجاع من ملف<input type="file" accept=".json,application/json" style="display:none" onchange="restoreFile(this.files[0])"></label>
  <button class="btn t" onclick="backup()">📋 نسخ البيانات كنص</button>
  <button class="btn t" onclick="restore()">📥 استرجاع من نص</button>
  <h2>نقطة الانطلاق</h2>
  <p class="mu">كل المسارات في خرائط جوجل بتبدأ من: <b>${e(S.home.n)}</b>${S.home.mz?' ('+e(S.home.mz)+')':''}${S.home.lat!=null?' ✓':''}</p>
  <button class="btn t" onclick="setHome()">📍 غيّر نقطة الانطلاق</button>
  <h2>تسجيل الزيارات تلقائيًا</h2>
  <p class="mu">لما تفتح التطبيق وانت عند عملاء، بيقارن موقعك بمواقعهم المسجلة ويسجل الزيارة لوحده. الموقع بيتشيك وقت الفتح بس، مش في الخلفية.</p>
  <button class="btn t" onclick="toggleAuto()">🛰 التسجيل التلقائي: ${S.auto?'شغال ✅':'مقفول'}</button>
  <h2>تتبع خط السير</h2>
  <p class="mu">بيسجّل مكانك كل 4 دقايق طول ما التطبيق مفتوح، وبيقارن مشوارك الفعلي بخطة النهارده.</p>
  <button class="btn t" onclick="toggleTrk()">🛣 التتبع: ${S.trkOn?'شغال ✅':'مقفول'}</button>
  <h2>🤖 الذكاء الاصطناعي (اختياري)</h2>
  <p class="mu">المساعد بيشتغل من غير إنترنت ومن غير مفتاح. لو فعّلت الذكاء الاصطناعي، الأسئلة اللي مش مفهومة محليًا بتتبعت للذكاء الاصطناعي باستخدام مفتاحك (Google Gemini أو Anthropic، والمزوّد بيتعرف من شكل المفتاح)، ومعاها أسماء وأرصدة العملاء المتعلقين بالسؤال، من غير أرقام التليفون. المفتاح بيتحفظ على الموبايل ده بس، ومش بيدخل في النسخة الاحتياطية.</p>
  <p class="mu" style="margin:6px 0"><b>الحالة:</b> ${aiStatus()}</p>
  <input id="aik" type="password" placeholder="${aiKey()?'المفتاح محفوظ ✅ (اكتب مفتاح جديد لو عايز تغيّره)':'مفتاح API (Google Gemini أو Anthropic)'}">
  <input id="aim" placeholder="اسم موديل Gemini (اختياري)" value="${e(aiModel())}">
  <label class="mu" style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><input id="aiok" type="checkbox" ${S.aiOk?'checked':''} style="width:24px;height:24px;min-width:24px;min-height:24px;margin:0;flex:none"> أوافق إن الأسئلة اللي مش مفهومة تتبعت للذكاء الاصطناعي</label>
  <button class="btn t" onclick="aiSave()">💾 حفظ إعدادات المساعد</button>
  ${aiKey()?'<button class="btn t dg" onclick="aiForget()">🗑 امسح المفتاح</button>':''}
  <button class="btn t" onclick="aiShowModels()">🔍 اعرض الموديلات المتاحة لمفتاحي</button>
  ${aiModelsHTML()}
  <h2>قفل التطبيق</h2>
  <p class="mu">${S.pin?'القفل شغال.':'القفل مقفول.'} الرقم السري بيمنع أي حد يفتح الموقع على موبايلك، لكنه مش تشفير للبيانات.</p>
  <button class="btn t" onclick="setPin()">${S.pin?'🔑 تغيير الرقم السري':'🔒 تفعيل رقم سري'}</button>
  ${S.pin?'<button class="btn t" onclick="rmPin()">🔓 إلغاء القفل</button>':''}
  <h2>التثبيت كتطبيق</h2><p class="mu">من قايمة المتصفح اختار Add to Home Screen.</p>`}
function dlBackup(){try{const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sales-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();S.lb=Date.now();save();toast('تم تنزيل النسخة');render()}catch(_){backup()}}
async function backup(){try{await navigator.clipboard.writeText(JSON.stringify(S));S.lb=Date.now();save();toast('تم النسخ، الصقه في ملاحظات أو واتساب')}catch(_){prompt('انسخ النص ده واحفظه:',JSON.stringify(S))}}
function applyBackup(t){try{const d=JSON.parse(t);if(!d.customers||!d.products)throw 0;if(!confirm('هتستبدل كل البيانات الحالية بالنسخة دي؟'))return;S=d;fix();unl=true;save();toast('تم الاسترجاع');go('today')}catch(_){toast('النص غير صالح')}}
function restore(){const t=prompt('الصق النسخة الاحتياطية:');if(t)applyBackup(t)}
function restoreFile(f){if(!f)return;const r=new FileReader();r.onload=()=>applyBackup(String(r.result));r.readAsText(f)}

// ---------- DEBTS / REPORTS ----------
function debtsView(){const l=S.customers.map(c=>({c,b:bal(c.id)})).filter(x=>x.b>0).sort((a,b)=>b.b-a.b),tot=l.reduce((s,x)=>s+x.b,0);
  return `${back("go('today')")}<h2>المديونيات</h2><div class="card stat">إجمالي اللي ليك عند العملاء<b class="red">${M(tot)}</b></div>
  ${l.map(({c,b})=>`<div class="card"><div class="stat" style="font-size:18px"><span><b>${e(c.name)}</b><br><span class="mu">${e([c.village,c.mz].filter(Boolean).join(' - '))}</span>${lateTag(c.id)}</span><b class="red" style="font-size:22px">${M(b)}</b></div><div class="row" style="margin-top:10px"><button class="btn t sm" onclick="open_('${c.id}')">فتح الحساب</button><a class="btn t sm" target="_blank" rel="noopener" href="${e(wa(c.phone,`السلام عليكم يا ${c.name}، بخصوص حسابك: المتبقي ${r2(b)} جنيه. ياريت تسوّيه وقت ما تقدر. شكرًا لتعاملك معانا 🌾`))}">📲 تذكير واتساب</a></div></div>`).join('')||'<p class="mu">مفيش مديونيات 🎉</p>'}`}
function repView(){const now=Date.now(),st={d:day0(),w:now-6048e5,m:now-2592e6,a:0}[rp];
  const os=S.orders.filter(o=>!o.cx&&o.t>=st),col=S.ledger.filter(l=>l.type==='PAID'&&l.t>=st).reduce((a,l)=>a+l.amt,0),sales=os.reduce((a,o)=>a+o.total,0);
  const pr={},cu={};os.forEach(o=>{cu[o.cid]=(cu[o.cid]||0)+o.total;o.items.forEach(i=>{const x=pr[i.name]=pr[i.name]||{q:0,r:0};x.q+=i.qty;x.r+=i.qty*i.price})});
  const top=(m,f)=>Object.entries(m).sort((a,b)=>f(b[1])-f(a[1])).slice(0,5);
  return `${back("go('today')")}<h2>التقارير</h2>

// ---------- APPROX LOCATION FROM VILLAGE NAMES ----------
let geoBusy=false;
async function geoVillage(vl,mz){const a=[vl,mz&&mz!=='بدون مركز'?'مركز '+mz:'','بني سويف','مصر'].filter(Boolean).join('، '),b=[vl,'بني سويف','مصر'].join('، '),qs=a===b?[a]:[a,b];let errs=0;
  for(let i=0;i<qs.length;i++){try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=eg&accept-language=ar&viewbox=30.3,29.5,31.7,28.2&bounded=1&q='+encodeURIComponent(qs[i]));
    if(r.ok){const j=await r.json(),h=j.find(x=>+x.lat>=28.2&&+x.lat<=29.5&&+x.lon>=30.3&&+x.lon<=31.7);if(h)return{lat:+(+h.lat).toFixed(5),lng:+(+h.lon).toFixed(5),n:h.display_name}}else errs++}catch(_){errs++}
    await new Promise(r=>setTimeout(r,1100))}
  return errs===qs.length?undefined:null}
async function approxAll(silent,keep,only){if(geoBusy)return null;const todo={};
  S.customers.forEach(c=>{if(c.lat==null&&c.village&&(!only||only.has(c.id))){const k=nk(c.mz||'')+'|'+nk(c.village);(todo[k]=todo[k]||{mz:c.mz||'',vl:c.village,cs:[]}).cs.push(c)}});
  const keys=Object.keys(todo);if(!keys.length){if(!silent)toast('مفيش عملاء من غير موقع وليهم قرية');return{ok:0,bad:[],fail:0}}
  if(!silent&&!confirm('هدوّر على '+keys.length+' قرية بالإنترنت، هياخد حوالي '+Math.ceil(keys.length*1.2)+' ثانية. تكمّل؟'))return null;
  geoBusy=true;S.vc=S.vc||{};let ok=0,fail=0;const bad=[];
  try{for(let i=0;i<keys.length;i++){const k=keys[i],t=todo[k];toast('بدوّر '+(i+1)+' من '+keys.length+': '+t.vl);
    let r=S.vc[k];if(r&&r.miss&&Date.now()-r.miss<6048e5)r=null;else if(!r||r.miss){r=await geoVillage(t.vl,t.mz);if(r!==undefined){S.vc[k]=r||{miss:Date.now()};save()}await new Promise(x=>setTimeout(x,1100))}
    if(r){t.cs.forEach(c=>{if(c.lat==null){c.lat=r.lat;c.lng=r.lng;c.approx=1;c.acc=0;if(silent&&!keep)c.init=1;ok++}})}else if(r===undefined)fail++;else bad.push(t.vl+(t.mz?' ('+t.mz+')':''))}}
  finally{geoBusy=false;save();render()}
  if(!silent){toast('اتحدد موقع تقريبي لـ '+ok+' عميل'+(fail?' (فشل الاتصال في '+fail+' قرية، جرّب تاني)':''));
    if(bad.length)alert('مالقيتش مكان لـ '+bad.length+' قرية:\n'+bad.join('\n')+'\n\nسجّل موقع عملاء القرى دي بإيدك من صفحة العميل.')}
  return{ok,bad,fail}}
function clearApprox(){if(!confirm('تمسح كل المواقع التقريبية؟ المواقع الدقيقة مش هتتأثر.'))return;S.customers.forEach(c=>{if(c.approx){c.lat=null;c.lng=null;c.approx=0}});save();toast('اتمسحت');render()}
const gll=x=>{const c=x.cs.find(c=>c.lat!=null);if(c)return{lat:c.lat,lng:c.lng};const r=S.vc&&S.vc[nk(x.mz==='بدون مركز'?'':x.mz)+'|'+nk(x.vl)];return r&&r.lat!=null?r:null};
async function villageLL(vl,mz){const k=nk(mz&&mz!=='بدون مركز'?mz:'')+'|'+nk(vl);S.vc=S.vc||{};let r=S.vc[k];
  if(r&&r.lat!=null)return r;if(r&&r.miss&&Date.now()-r.miss<6048e5)return null;
  r=await geoVillage(vl,mz);S.vc[k]=r||{miss:Date.now()};save();await new Promise(x=>setTimeout(x,1100));return r}
async function fillApprox(id){const c=C(id);if(!c||c.lat!=null||!c.village)return;toast('بدوّر على موقع '+c.village+'...');
  const r=await villageLL(c.village,c.mz),c2=C(id);if(!c2||c2.lat!=null)return;
  if(r){c2.lat=r.lat;c2.lng=r.lng;c2.approx=1;c2.acc=0;save();toast('اتحدد موقع '+c2.village+' تقريبيًا');if(v.cid===id||(v.tab==='cust'&&!v.cedit&&!v.addc&&!v.imp&&!v.order))render()}
  else toast('مالقيتش '+c2.village+' على الخريطة. سجّل موقعه بإيدك من صفحة العميل')}
function tourHref(g){let st=g.slice(0,10).map(x=>{const c=gll(x);return c?{ll:c.lat+','+c.lng,lat:c.lat,lng:c.lng}:{ll:[x.vl,x.mz==='بدون مركز'?'':x.mz,'بني سويف مصر'].filter(Boolean).join(' ')}});
  if(st.length>2&&st.every(s=>s.lat!==undefined)){const H=homeLL(),r=[];let cur=H;if(!cur){cur=st.shift();r.push(cur)}while(st.length){let bi=0,bd=1e9;st.forEach((s,i)=>{const d=hav(cur,s);if(d<bd){bd=d;bi=i}});cur=st.splice(bi,1)[0];r.push(cur)}st=r}
  const dest=st[st.length-1],w=st.slice(0,-1).map(s=>s.ll).join('|');
  return 'https://www.google.com/maps/dir/?api=1&travelmode=driving'+originQ()+'&destination='+encodeURIComponent(dest.ll)+(w?'&waypoints='+encodeURIComponent(w):'')}

const originQ=()=>S.home?'&origin='+encodeURIComponent(S.home.lat!=null?S.home.lat+','+S.home.lng:[S.home.n,S.home.mz?'مركز '+S.home.mz:'','بني سويف','مصر'].filter(Boolean).join('، ')):'';
async function homeGeo(){const h=S.home;if(!h||h.lat!=null||navigator.onLine===false||(h.miss&&Date.now()-h.miss<6048e5))return;const r=await geoVillage(h.n,h.mz);if(r){h.lat=r.lat;h.lng=r.lng;delete h.miss}else h.miss=Date.now();save()}

let initBusy=false;
async function initOld(){if(initBusy||S.initDone||!unl||!S.customers.length)return;initBusy=true;
  try{if(!S.initV){const t=Date.now(),need=S.customers.filter(c=>!c.pend&&!S.visits.some(x=>x.cid===c.id)&&!S.orders.some(o=>!o.cx&&o.cid===c.id));
      need.forEach(c=>S.visits.push({id:uid(),cid:c.id,t,auto:5}));S.initV=1;S.initNote={v:need.length,l:0,bad:[]};save();render()}

      if(r){S.initNote=S.initNote||{v:0,l:0,bad:[]};S.initNote.l=(S.initNote.l||0)+r.ok;S.initNote.bad=r.bad;if(!r.fail)S.initDone=1}}
    else S.initDone=1;
    save();render()}finally{initBusy=false}}
function undoInit(){if(!confirm('تلغي التجهيز الأولي؟ هتتمسح الزيارات الأولية والمواقع التقريبية اللي اتحطت للعملاء القدام.'))return;
  S.visits=S.visits.filter(x=>x.auto!==5);S.customers.forEach(c=>{if(c.init&&c.approx){c.lat=null;c.lng=null;c.approx=0}c.init=0});S.initNote=null;S.initDone=1;S.initV=1;save();toast('اتلغى التجهيز الأولي');render()}
async function setupOld(){const need=S.customers.filter(c=>!S.visits.some(x=>x.cid===c.id)&&!S.orders.some(o=>!o.cx&&o.cid===c.id));

const VV=1.5,VR=150,isEx=c=>c.lat!=null&&!c.approx;let lookupRes=null;
function gpsNow(){return new Promise((ok,no)=>{if(!navigator.geolocation)return no({code:0});navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy||0}),no,{enableHighAccuracy:true,timeout:20000,maximumAge:30000})})}
function ctr(x){const ex=x.cs.filter(c=>c.lat!=null&&!c.approx);if(ex.length)return{lat:ex.reduce((a,c)=>a+c.lat,0)/ex.length,lng:ex.reduce((a,c)=>a+c.lng,0)/ex.length};return gll(x)}
async function whereAmI(silent){let p;try{p=await gpsNow()}catch(err){if(!silent)toast(err&&err.code===1?'الإذن مرفوض. فعّل الموقع للمتصفح من إعدادات الآيفون':'مقدرتش أحدد موقعك. تأكد إن الـ GPS شغال');return}
  if(p.acc>150){if(!silent)toast('دقة الموقع ضعيفة (حوالي '+Math.round(p.acc)+' متر). جرّب برا المبنى');return}
  const names=[];S.customers.forEach(c=>{if(c.lat!=null&&!c.approx&&hav(p,c)*1000<=VR+Math.min(p.acc,50)&&autoVisit(c.id,2))names.push(c.name)});
  const vs=[];groups().forEach(x=>{if(!x.cs.length||x.last>=day0())return;const c=ctr(x);if(c&&hav(p,c)<=VV){S.pv.push({id:uid(),mz:x.mz,vl:x.vl,t:Date.now(),auto:1});vs.push(gname(x))}});
  if(names.length||vs.length){save();toast('اتسجلت زيارة: '+[...names,...vs.map(n=>'قرية '+n)].join('، '));render()}
  else if(!silent){pickFix=p;v={tab:'cov',pick:1};render()}}
function autoCheck(){if(!S.auto||!unl||Date.now()-(S.lastAuto||0)<12e5)return;S.lastAuto=Date.now();save();whereAmI(true)}
function toggleAuto(){S.auto=!S.auto;save();render();if(S.auto)whereAmI()}
function visitsHTML(cid){const vs=S.visits.filter(x=>x.cid===cid).sort((a,b)=>b.t-a.t);
  return '<h2>الزيارات</h2>'+(vs.length?`<p class="mu" style="margin-top:-8px">${vs.length} زيارة • آخر زيارة ${dt(vs[0].t)}</p>`+vs.slice(0,5).map(x=>`<div class="card stat" style="font-size:16px"><span>${dt(x.t)} <span class="mu">${x.auto===5?'• تسجيل أولي':x.auto===2?'• بالموقع':x.auto?'• تلقائي':''}</span></span><button class="qb" onclick="delVisit('${x.id}')">✖</button></div>`).join(''):'<p class="mu">لسه مفيش زيارات مسجلة</p>')}
function delVisit(id){if(!confirm('تحذف الزيارة دي؟'))return;S.visits=S.visits.filter(x=>x.id!==id);save();render()}
async function lookupVillage(){const vl=($('lv').value||'').trim(),mz=$('lm').value;if(!vl)return toast('اكتب اسم القرية');
  toast('بدوّر على '+vl+'...');const r=await geoVillage(vl,mz);if(!r)return toast('مالقيتش القرية دي على الخريطة. جرّب كتابة تانية أو اختار المركز');
  S.vc=S.vc||{};S.vc[nk(mz||'')+'|'+nk(vl)]=r;
  let n=0;
  S.customers.forEach(c=>{if(c.lat==null&&c.village&&nk(c.village)===nk(vl)&&(!mz||!c.mz||nk(c.mz)===nk(mz))){c.lat=r.lat;c.lng=r.lng;c.approx=1;c.acc=0;if(!c.mz&&mz)c.mz=mz;n++}});
  const inG=Object.entries(GZ).some(([z,l])=>(!mz||z===mz)&&l.some(q=>nk(q)===nk(vl))),inC=S.customers.some(c=>nk(c.village||'')===nk(vl));
  if(!inG&&!inC&&!S.places.some(p=>nk(p.vl)===nk(vl)&&(!mz||p.mz===mz)))S.places.push({id:uid(),mz:mz||'بدون مركز',vl});
  save();lookupRes={vl,mz,n,r};render()}

// ---------- GEOFENCE SETTINGS + ROUTE TRACKING ----------
const TRK_MS=24e4;let trkTimer=null,tkd=0;
function trkAdd(p,t,force){S.tp=S.tp||[];const last=S.tp[S.tp.length-1];if(!force&&last&&t-last.t<TRK_MS-1e4)return false;
  S.tp.push({t,lat:+p.lat.toFixed(5),lng:+p.lng.toFixed(5),a:Math.round(p.acc||0)});
  const cut=t-7*864e5;if(S.tp[0].t<cut)S.tp=S.tp.filter(x=>x.t>=cut);return true}
async function trkSample(force){if(!S.trkOn||!unl)return;const last=(S.tp||[]).slice(-1)[0];if(!force&&last&&Date.now()-last.t<TRK_MS-1e4)return;
  try{const p=await gpsNow();if(p.acc<=200&&trkAdd(p,Date.now(),force))save()}catch(_){}}
function trkStart(){if(trkTimer)clearInterval(trkTimer);trkTimer=null;if(S.trkOn){trkTimer=setInterval(()=>{if(document.visibilityState==='visible')trkSample()},TRK_MS);trkSample()}}
function toggleTrk(){S.trkOn=S.trkOn?0:1;save();trkStart();toast(S.trkOn?'تتبع خط السير شغال طول ما التطبيق مفتوح':'اتقفل تتبع خط السير');render()}
function clearTrk(){if(!confirm('تمسح كل نقاط خط السير؟'))return;S.tp=[];save();toast('اتمسحت النقاط');render()}
// today's plan is frozen the first time it is computed, so it can be compared with where the rep really went
function planToday(){const d=day0();if(S.plan&&S.plan.d===d)return S.plan;
  const own=groups().filter(x=>x.cs.length),sc={};own.filter(x=>x.st>=2&&x.mz!=='بدون مركز').forEach(x=>{sc[x.mz]=(sc[x.mz]||0)+(x.st===3?3:2)});
  const bm=Object.keys(sc).sort((a,b)=>sc[b]-sc[a])[0],ord=(a,b)=>b.st-a.st||(b.days||0)-(a.days||0)||b.cs.length-a.cs.length,
    tour=bm?own.filter(x=>x.mz===bm&&x.st>=2).sort(ord).slice(0,4):[];
  if(!tour.length)return null;S.plan={d,mz:bm,keys:tour.map(x=>x.key)};save();return S.plan}
function trkPts(off){const a=day0()-off*864e5,b=a+864e5;return(S.tp||[]).filter(x=>x.t>=a&&x.t<b).sort((x,y)=>x.t-y.t)}
const hm=t=>new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
function trkSvg(pts,stops,home){const all=[...pts,...stops.map(s=>s.c),...(home?[home]:[])];if(!all.length)return '';
  const W=340,H=300,p=28,la=all.map(c=>c.lat),ln=all.map(c=>c.lng),a=Math.min(...la),b=Math.max(...la),x0=Math.min(...ln),x1=Math.max(...ln),k=Math.cos((a+b)/2*Math.PI/180),dx=(x1-x0)*k,dy=b-a,one=dx<1e-7&&dy<1e-7,
    sc=one?0:Math.min(dx>1e-7?(W-2*p)/dx:1e9,dy>1e-7?(H-2*p)/dy:1e9),ox=(W-dx*sc)/2,oy=(H-dy*sc)/2,pt=c=>one?[W/2,H/2]:[ox+(c.lng-x0)*k*sc,oy+(b-c.lat)*sc];
  const line=pts.map(c=>pt(c).map(n=>n.toFixed(1)).join(',')).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:var(--bg);border-radius:10px"><text x="${W-6}" y="16" font-size="12" fill="var(--mu)" text-anchor="end">⬆ شمال</text>
  ${pts.length>1?`<polyline points="${line}" fill="none" stroke="var(--grn)" stroke-width="3" stroke-linejoin="round" opacity=".85"/>`:''}
  ${stops.map(s=>{const[x,y]=pt(s.c);return `<g><circle cx="${x}" cy="${y}" r="9" fill="none" stroke="#1565c0" stroke-width="3"/><text x="${x}" y="${y-13}" font-size="11" text-anchor="middle" fill="var(--tx)">${e(s.n.split(' ')[0])}</text></g>`}).join('')}
  ${pts.map(c=>{const[x,y]=pt(c);return `<circle cx="${x}" cy="${y}" r="2.5" fill="var(--grn)"/>`}).join('')}
  ${pts.length?(()=>{const[x1_,y1_]=pt(pts[0]),[x2,y2]=pt(pts[pts.length-1]);return `<circle cx="${x1_}" cy="${y1_}" r="7" fill="#2e7d32" stroke="#fff" stroke-width="2"/><circle cx="${x2}" cy="${y2}" r="7" fill="#c62828" stroke="#fff" stroke-width="2"/>`})():''}</svg>`}

function gmUrls(st){const o=[];for(let i=0;i<st.length;i+=9){const ch=st.slice(i,i+9),d=wp(ch[ch.length-1]),w=ch.slice(0,-1).map(wp).join('|');

aiNearest=function(n){const idx=aiMsgs.length,set=h=>{aiMsgs[idx]={bot:1,h};aiRender()},cnt=Math.min(10,Math.max(3,(String(n||'').match(/\d+/)||[3])[0]|0));

const _aiLocal2=aiLocal;aiLocal=function(q){const n=anorm(q);
